<script>
const QUESTOES = [{"num": 1, "exame": "OAB – estilo FGV", "titulo": "Requisitos para Inscrição como Estagiário", "enunciado": "João cursa o 8º período da faculdade de Direito e deseja se inscrever como estagiário na OAB para atuar em um escritório de advocacia.", "comando": "Segundo o Estatuto da Advocacia, para a inscrição de João como estagiário é necessário preencher os requisitos do art. 8º relativos a:", "alt": {"A": "Capacidade civil; diploma de graduação em direito; título de eleitor e quitação do serviço militar; não exercer atividade incompatível; idoneidade moral; e prestação de compromisso.", "B": "Capacidade civil; título de eleitor e quitação do serviço militar, se brasileiro; não exercer atividade incompatível com a advocacia; idoneidade moral; e prestação de compromisso perante o conselho — sem necessidade de diploma ou aprovação no Exame de Ordem.", "C": "Apenas aprovação prévia em Exame de Ordem, dispensados os demais requisitos do art. 8º.", "D": "Diploma de graduação em direito e aprovação no Exame de Ordem, exclusivamente."}, "gabarito": "B", "fb": {"A": "Incorreta. O diploma de graduação (inciso II do art. 8º) NÃO é exigido do estagiário, que ainda está cursando a faculdade.", "B": "Correta! Art. 9º, I, Lei 8.906/94: para inscrição como estagiário é necessário preencher os requisitos mencionados nos incisos I, III, V, VI e VII do art. 8º — ou seja, capacidade civil (I), título de eleitor e quitação do serviço militar se brasileiro (III), não exercer atividade incompatível (V), idoneidade moral (VI) e prestação de compromisso (VII). Ficam de fora justamente o diploma (inciso II) e a aprovação no Exame de Ordem (inciso IV), que só são exigidos para a inscrição definitiva como ADVOGADO.", "C": "Incorreta. O Exame de Ordem é exigido para a inscrição como ADVOGADO, não para o estagiário.", "D": "Incorreta. Nenhum desses dois requisitos (diploma e Exame de Ordem) é exigido do estagiário."}, "fund": "Art. 9º, I, c/c art. 8º, I, III, V, VI e VII, Lei 8.906/94.", "caqui": "Decore por EXCLUSÃO: dos 7 incisos do art. 8º (requisitos do advogado), o estagiário precisa de TODOS, MENOS o diploma (inciso II) e a aprovação no Exame de Ordem (inciso IV) — exatamente os dois requisitos que ele ainda não tem condição de cumprir, por ainda estar cursando a faculdade. Faz todo sentido lógico: não dá para exigir diploma de quem ainda não se formou, nem Exame de Ordem de quem ainda não pode nem prestar o exame regularmente."}, {"num": 2, "exame": "CESPE – estilo", "titulo": "Admissão em Estágio Profissional", "enunciado": "Além de preencher os requisitos do art. 8º aplicáveis ao estagiário, o Estatuto exige mais uma condição específica para a inscrição.", "comando": "Segundo o art. 9º, II, do Estatuto da Advocacia, essa condição adicional é:", "alt": {"A": "Ter sido aprovado em processo seletivo público.", "B": "Ter sido admitido em estágio profissional de advocacia.", "C": "Possuir experiência prévia de, no mínimo, 6 meses em área jurídica.", "D": "Ter cursado disciplina específica de ética profissional na faculdade."}, "gabarito": "B", "fb": {"A": "Incorreta. Não há exigência de processo seletivo público — o estágio pode ser obtido em escritórios, órgãos jurídicos ou pela própria instituição de ensino.", "B": "Correta! Art. 9º, II, Lei 8.906/94: além dos requisitos do art. 8º, é necessário “ter sido admitido em estágio profissional de advocacia” — ou seja, precisa haver um vínculo formal de estágio (convênio, termo de estágio) antes da inscrição na OAB.", "C": "Incorreta. Não há exigência de experiência prévia para iniciar o estágio.", "D": "Incorreta. Não há essa exigência curricular específica na lei federal — o estudo do Estatuto e do Código de Ética é obrigatório DURANTE o estágio (art. 9º, §1º), não como pré-requisito para ingressar nele."}, "fund": "Art. 9º, II, Lei 8.906/94.", "caqui": "A lógica é simples: primeiro você precisa CONSEGUIR o estágio (convênio com escritório, órgão jurídico ou instituição de ensino), para DEPOIS se inscrever na OAB como estagiário. Não é possível se inscrever como estagiário “no vazio”, sem ter sido efetivamente admitido em um estágio profissional formalizado."}, {"num": 3, "exame": "OAB – estilo FGV", "titulo": "Duração e Instituições Mantenedoras do Estágio", "enunciado": "Uma faculdade de Direito pretende manter, ela mesma, o estágio profissional de advocacia de seus alunos dos últimos anos do curso.", "comando": "Segundo o art. 9º, §1º, do Estatuto da Advocacia, é correto afirmar que:", "alt": {"A": "O estágio profissional de advocacia, com duração de dois anos, só pode ser mantido por escritórios de advocacia credenciados, nunca pela própria instituição de ensino.", "B": "O estágio profissional de advocacia, com duração de dois anos, realizado nos últimos anos do curso jurídico, pode ser mantido pelas instituições de ensino superior, pelos Conselhos da OAB, ou por setores, órgãos jurídicos e escritórios de advocacia credenciados pela OAB.", "C": "O estágio tem duração mínima de quatro anos, coincidindo com a integralidade do curso jurídico.", "D": "Só pode ser mantido pelo Conselho Federal da OAB, vedada a delegação a instituições de ensino ou escritórios."}, "gabarito": "B", "fb": {"A": "Incorreta. A própria instituição de ensino superior PODE manter o estágio — é uma das hipóteses expressamente previstas.", "B": "Correta! Art. 9º, §1º, Lei 8.906/94: “O estágio profissional de advocacia, com duração de dois anos, realizado nos últimos anos do curso jurídico, pode ser mantido pelas respectivas instituições de ensino superior, pelos Conselhos da OAB, ou por setores, órgãos jurídicos e escritórios de advocacia credenciados pela OAB, sendo obrigatório o estudo deste Estatuto e do Código de Ética e Disciplina”.", "C": "Incorreta. A duração é de DOIS anos, não quatro.", "D": "Incorreta. Há pluralidade de instituições que podem manter o estágio, não apenas o Conselho Federal."}, "fund": "Art. 9º, §1º, Lei 8.906/94.", "caqui": "Memorize as 3 categorias de mantenedores do estágio (mnemônico I-C-E): Instituições de ensino superior; Conselhos da OAB; Escritórios/órgãos jurídicos credenciados pela OAB. E não esqueça a consequência prática dessa duração de 2 anos: como o estágio deve ocorrer nos últimos anos do curso, quem entra no estágio no início do curso (ainda que permitido para fins de aprendizagem em alguns casos) não tem, a princípio, direito à inscrição na OAB como estagiário nesse período inicial."}, {"num": 4, "exame": "CESPE – estilo", "titulo": "Conselho Seccional Competente para a Inscrição", "enunciado": "Marina cursa Direito em uma faculdade localizada no Estado do Rio de Janeiro, mas reside e tem domicílio eleitoral em Minas Gerais.", "comando": "Segundo o Estatuto da Advocacia, a inscrição de Marina como estagiária deve ser feita:", "alt": {"A": "No Conselho Seccional de Minas Gerais, por ser seu domicílio eleitoral.", "B": "No Conselho Seccional do Rio de Janeiro, em cujo território se localiza seu curso jurídico.", "C": "No Conselho Federal da OAB, diretamente, independentemente do local do curso.", "D": "Em qualquer Conselho Seccional, à livre escolha da estudante."}, "gabarito": "B", "fb": {"A": "Incorreta. O critério legal não é o domicílio eleitoral, mas o local do curso jurídico.", "B": "Correta! Art. 9º, §2º, Lei 8.906/94: “A inscrição do estagiário é feita no Conselho Seccional em cujo território se localize seu curso jurídico”.", "C": "Incorreta. A inscrição é feita no Conselho SECCIONAL, não diretamente no Conselho Federal.", "D": "Incorreta. Não há livre escolha — o critério legal é objetivo: local do curso jurídico."}, "fund": "Art. 9º, §2º, Lei 8.906/94.", "caqui": "Regra objetiva e fácil de decorar: o critério é sempre o local do CURSO JURÍDICO, nunca o domicílio pessoal, eleitoral ou de trabalho do estudante. Se a faculdade fica no RJ, a inscrição é no Conselho Seccional do RJ, mesmo que a estudante more em outro Estado."}, {"num": 5, "exame": "OAB – estilo FGV", "titulo": "Aluno com Atividade Incompatível", "enunciado": "Pedro é delegado de polícia (atividade incompatível com a advocacia) e, paralelamente, cursa a faculdade de Direito, desejando frequentar o estágio para fins de aprendizagem.", "comando": "Segundo o Estatuto da Advocacia, Pedro:", "alt": {"A": "Pode se inscrever normalmente como estagiário na OAB, pois a incompatibilidade só se aplica a advogados já inscritos.", "B": "Pode frequentar o estágio ministrado pela respectiva instituição de ensino superior, para fins de aprendizagem, mas é vedada sua inscrição na OAB.", "C": "Não pode, em hipótese alguma, frequentar qualquer modalidade de estágio de advocacia.", "D": "Pode se inscrever como estagiário, desde que renuncie ao cargo de delegado durante o período do estágio."}, "gabarito": "B", "fb": {"A": "Incorreta. A incompatibilidade também obsta a inscrição como ESTAGIÁRIO, não apenas como advogado.", "B": "Correta! Art. 9º, §3º, Lei 8.906/94: “O aluno de curso jurídico que exerça atividade incompatível com a advocacia pode freqüentar o estágio ministrado pela respectiva instituição de ensino superior, para fins de aprendizagem, vedada a inscrição na OAB”.", "C": "Incorreta. A lei permite expressamente frequentar o estágio da PRÓPRIA instituição de ensino, apenas para fins de aprendizagem — só a inscrição na OAB é vedada.", "D": "Incorreta. Não há essa exigência de renúncia — a lei apenas veda a inscrição na OAB enquanto persistir a incompatibilidade."}, "fund": "Art. 9º, §3º, Lei 8.906/94.", "caqui": "Distinga duas coisas: FREQUENTAR o estágio para aprender (permitido, mesmo com atividade incompatível, mas só na própria instituição de ensino) x INSCREVER-SE na OAB como estagiário (vedado enquanto houver incompatibilidade). É a mesma lógica que impede advogados incompatíveis (como delegados, juízes, membros do MP) de exercer a advocacia — aqui aplicada preventivamente, já na fase de estágio."}, {"num": 6, "exame": "CESPE – estilo", "titulo": "Estágio de Bacharel em Direito (Art. 9º, §4º)", "enunciado": "Carla concluiu a faculdade de Direito, mas ainda não foi aprovada no Exame de Ordem. Ela deseja continuar vinculada a um escritório na condição de estagiária até conseguir a aprovação.", "comando": "Sobre essa possibilidade, é correto afirmar que:", "alt": {"A": "O Estatuto veda expressamente que bacharel em direito, já formado, permaneça inscrito como estagiário.", "B": "O art. 9º, §4º, do Estatuto prevê a possibilidade de estágio para o bacharel em direito, havendo controvérsia jurisprudencial sobre a duração máxima dessa modalidade, distinta do estágio do graduando.", "C": "O bacharel só pode se inscrever como estagiário se retornar à faculdade para cursar disciplinas adicionais.", "D": "Após a colação de grau, a inscrição como estagiário se converte automaticamente em inscrição como advogado."}, "gabarito": "B", "fb": {"A": "Incorreta. Existe previsão legal específica para essa hipótese, e não há vedação genérica.", "B": "Correta! O art. 9º, §4º, da Lei 8.906/94 disciplina o estágio do BACHAREL EM DIREITO (já formado, ainda não aprovado no Exame de Ordem), modalidade distinta do estágio do graduando (art. 9º, §1º, com 2 anos de duração, nos últimos anos do curso). Há debate na jurisprudência administrativa e judicial sobre se esse estágio de bacharel também se sujeita a prazo máximo de duração (há julgados que reconhecem a improrrogabilidade, com prazo de validade de até três anos do cartão de identidade profissional, e entendimentos administrativos que consideram o estágio do bacharel sem prazo definido, exigindo apenas a renovação periodódica da identidade).", "C": "Incorreta. Não há essa exigência de retorno acadêmico para manter o estágio de bacharel.", "D": "Incorreta. Não há conversão automática — a inscrição como advogado exige aprovação no Exame de Ordem e cumprimento dos demais requisitos do art. 8º."}, "fund": "Art. 9º, §4º, Lei 8.906/94; art. 35, Regulamento Geral do Estatuto da Advocacia e da OAB (jurisprudência administrativa controvertida sobre prazo).", "caqui": "Esse é um ponto avançado, ótimo para questões de segunda fase ou provas mais detalhistas: existem DOIS regimes de estágio na mesma lei — o do GRADUANDO (§1º, 2 anos, nos últimos anos do curso) e o do BACHAREL JÁ FORMADO (§4º, sem passar ainda no Exame de Ordem). Não confunda as figuras do estagiário, do bacharel e do advogado — são estágios sucessivos e distintos da carreira, com regimes jurídicos próprios."}, {"num": 7, "exame": "OAB – estilo FGV", "titulo": "Estágio Remoto em Situações Excepcionais (Lei 14.365/2022)", "enunciado": "Durante um período de calamidade pública declarada pelo poder público, que impossibilita atividades presenciais, um escritório de advocacia pretende manter seus estagiários trabalhando de forma remota.", "comando": "Segundo a atual redação do Estatuto da Advocacia, dada pela Lei 14.365/2022, essa possibilidade:", "alt": {"A": "é vedada, pois o estágio profissional de advocacia exige sempre presença física nas dependências do empregador.", "B": "é permitida: em caso de pandemia ou outras situações excepcionais que impossibilitem atividades presenciais, declaradas pelo poder público, o estágio profissional pode ser realizado em regime de teletrabalho ou trabalho a distância, sem configurar vínculo de emprego.", "C": "é permitida, mas somente mediante autorização prévia, caso a caso, do Conselho Federal da OAB.", "D": "é permitida apenas para estagiários de órgãos públicos, nunca de escritórios privados."}, "gabarito": "B", "fb": {"A": "Incorreta. A Lei 14.365/2022 passou a permitir expressamente o regime remoto em situações excepcionais.", "B": "Correta! Art. 9º, §5º, Lei 8.906/94 (incluído pela Lei 14.365/2022): “Em caso de pandemia ou em outras situações excepcionais que impossibilitem as atividades presenciais, declaradas pelo poder público, o estágio profissional poderá ser realizado no regime de teletrabalho ou de trabalho a distância em sistema remoto ou não, por qualquer meio telemático, sem configurar vínculo de emprego a adoção de qualquer uma dessas modalidades”.", "C": "Incorreta. Não há exigência de autorização prévia caso a caso pelo Conselho Federal — a possibilidade decorre diretamente da lei, uma vez declarada a situação excepcional pelo poder público.", "D": "Incorreta. Não há essa restrição a órgãos públicos — vale também para escritórios privados."}, "fund": "Art. 9º, §5º, Lei 8.906/94, incluído pela Lei 14.365/2022.", "caqui": "Essa novidade surgiu diretamente da experiência da pandemia de Covid-19, quando inúmeros estágios ficaram em zona cinzenta sobre a validade do trabalho remoto. Agora a lei reconhece expressamente essa possibilidade, mas COM CONDIÇÃO: precisa haver uma situação excepcional (pandemia ou similar) DECLARADA PELO PODER PÚBLICO — não é uma faculdade genérica e permanente de estagiar remotamente a qualquer tempo por mera conveniência do escritório."}, {"num": 8, "exame": "CESPE – estilo", "titulo": "Equipamentos Fornecidos para Estágio Remoto", "enunciado": "Um escritório de advocacia decide fornecer notebook e acesso a sistema jurídico para que um estagiário realize suas atividades em regime de teletrabalho, durante situação excepcional declarada pelo poder público.", "comando": "Segundo a Lei 14.365/2022, essa concessão de equipamentos, sistemas ou materiais:", "alt": {"A": "é irrelevante juridicamente, não precisando constar de nenhum documento formal.", "B": "deve constar, expressamente, no convênio de estágio e no termo de estágio.", "C": "só pode ser feita mediante doação definitiva dos equipamentos ao estagiário.", "D": "é vedada, pois caracterizaria vínculo empregatício pela subordinação material gerada."}, "gabarito": "B", "fb": {"A": "Incorreta. A própria lei exige formalização expressa dessa concessão.", "B": "Correta! Art. 9º, §6º, Lei 8.906/94 (incluído pela Lei 14.365/2022): havendo concessão, pela parte contratante, de equipamentos, sistemas ou materiais destinados a viabilizar a realização da atividade de estágio, isso deve constar, expressamente, no convênio de estágio e no termo de estágio.", "C": "Incorreta. Não há exigência de doação definitiva — os equipamentos podem ser emprestados temporariamente, desde que formalizada a concessão nos documentos do estágio.", "D": "Incorreta. A própria lei prevê expressamente essa possibilidade sem gerar vínculo de emprego, desde que corretamente formalizada."}, "fund": "Art. 9º, §6º, Lei 8.906/94, incluído pela Lei 14.365/2022.", "caqui": "Essa exigência de formalização documental existe para evitar discussões futuras sobre eventual descaracterização do estágio (que poderia sugerir vínculo empregatício se não documentado corretamente). Ao registrar expressamente no convênio e no termo de estágio que o equipamento foi cedido para viabilizar o trabalho remoto, fica claro que se trata de instrumento de trabalho do estágio, e não de uma relação de emprego disfarçada."}, {"num": 9, "exame": "OAB – estilo FGV", "titulo": "Atos Praticados pelo Estagiário em Conjunto com o Advogado", "enunciado": "Um estagiário regularmente inscrito na OAB deseja subscrever, sozinho, uma petição inicial em nome do escritório onde estagia.", "comando": "Segundo o art. 3º, §2º, do Estatuto da Advocacia, essa conduta:", "alt": {"A": "é permitida livremente, pois o estagiário inscrito tem os mesmos poderes de um advogado.", "B": "é vedada: o estagiário só pode praticar os atos privativos da advocacia previstos no art. 1º em CONJUNTO com advogado e sob responsabilidade deste, salvo as exceções previstas no Regulamento Geral.", "C": "é permitida, desde que o estagiário esteja cursando o último semestre da faculdade.", "D": "é vedada em qualquer hipótese, mesmo que acompanhado de advogado."}, "gabarito": "B", "fb": {"A": "Incorreta. O estagiário NÃO tem os mesmos poderes do advogado — sua atuação é sempre condicionada, em regra, à atuação conjunta com advogado.", "B": "Correta! Art. 3º, §2º, Lei 8.906/94: “O estagiário de advocacia, regularmente inscrito, pode praticar os atos previstos no art. 1º, na forma do respectivo regulamento, em conjunto com advogado e sob responsabilidade deste”. Isso significa que a petição inicial (ato privativo, art. 1º, I) deve ser subscrita em CONJUNTO com um advogado, ressalvadas as hipóteses isoladas expressamente previstas no Regulamento Geral (art. 29, §1º, como assinar petições de juntada de documentos, o que é diferente de subscrever a petição inicial em si).", "C": "Incorreta. Não há essa exceção baseada em estar no último semestre — a regra da atuação conjunta vale durante todo o estágio.", "D": "Incorreta. É permitida, sim, quando feita em CONJUNTO com advogado — a lei não veda de forma absoluta, apenas exige a atuação compartilhada."}, "fund": "Art. 3º, §2º, Lei 8.906/94; art. 29, caput, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Essa é A regra-mãe de toda a atuação do estagiário, e a mais cobrada em prova: REGRA GERAL = atos privativos da advocacia (art. 1º) exigem atuação CONJUNTA com advogado, sob a RESPONSABILIDADE deste. EXCEÇÕES = alguns poucos atos específicos, listados no Regulamento Geral, que o estagiário pode praticar SOZINHO (veremos na próxima questão). Sempre que a questão falar em estagiário atuando “livremente” ou “com os mesmos poderes do advogado”, desconfie."}, {"num": 10, "exame": "CESPE – estilo", "titulo": "Atos Praticados Isoladamente pelo Estagiário", "enunciado": "O Regulamento Geral do Estatuto da Advocacia e da OAB lista um rol taxativo de atos que o estagiário inscrito pode praticar sozinho, sob a responsabilidade do advogado.", "comando": "Assinale a alternativa que contém atos que o estagiário PODE praticar isoladamente, segundo o art. 29, §1º, do Regulamento Geral.", "alt": {"A": "Sustentar oralmente recurso perante Tribunal e representar a parte em audiência de instrução.", "B": "Retirar e devolver autos em cartório, assinando a respectiva carga; obter certidões de peças ou autos junto aos escrivães; e assinar petições de juntada de documentos.", "C": "Assinar contrato de honorários advocatícios em nome do escritório.", "D": "Impetrar mandado de segurança sem acompanhamento de advogado."}, "gabarito": "B", "fb": {"A": "Incorreta. Sustentação oral e representação em audiência de instrução são atos que EXIGEM a presença e atuação do advogado — não estão entre as hipóteses isoladas do art. 29, §1º.", "B": "Correta! Art. 29, §1º, Regulamento Geral: o estagiário inscrito na OAB pode praticar isoladamente, sob a responsabilidade do advogado: I – retirar e devolver autos em cartório, assinando a respectiva carga; II – obter junto aos escrivães e chefes de secretarias certidões de peças ou autos de processos em curso ou findos; III – assinar petições de juntada de documentos a processos judiciais ou administrativos.", "C": "Incorreta. Contrato de honorários é ato de gestão próprio do advogado, não do estagiário.", "D": "Incorreta. Impetração de mandado de segurança é ato privativo que exige a atuação conjunta com advogado (regra geral do art. 3º, §2º)."}, "fund": "Art. 29, §1º, I a III, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Memorize os 3 atos isolados com o mnemônico <b>R-C-A</b>: Retirar/devolver autos (com carga); Certidões (obter junto a escrivães); Assinar petições de mera JUNTADA de documentos. Repare que são todos atos BUROCRÁTICOS/CARTORÁRIOS, de baixo risco jurídico — nada que envolva estratégia processual, sustentação de tese ou representação substancial da parte. Tudo isso continua exigindo o advogado."}, {"num": 11, "exame": "OAB – estilo FGV", "titulo": "Atos Extrajudiciais Praticados pelo Estagiário", "enunciado": "Um advogado outorga substabelecimento a um estagiário inscrito na OAB para que este compareça, sozinho, a um cartório de registro de imóveis para retirar uma certidão em nome do cliente.", "comando": "Segundo o Regulamento Geral do Estatuto da Advocacia, essa conduta:", "alt": {"A": "é vedada, pois o substabelecimento nunca pode ser outorgado a estagiário.", "B": "é permitida: para o exercício de atos extrajudiciais, o estagiário pode comparecer isoladamente, quando receber autorização ou substabelecimento do advogado.", "C": "é permitida apenas se o estagiário estiver acompanhado de outro advogado do escritório.", "D": "é vedada, pois atos extrajudiciais só podem ser praticados por advogados com mais de 5 anos de inscrição."}, "gabarito": "B", "fb": {"A": "Incorreta. A lei permite expressamente o substabelecimento a estagiário para atos extrajudiciais.", "B": "Correta! Art. 29, §2º, Regulamento Geral: “Para o exercício de atos extrajudiciais, o estagiário pode comparecer isoladamente, quando receber autorização ou substabelecimento do advogado”.", "C": "Incorreta. Não há exigência de acompanhamento de outro advogado nessa hipótese — a autorização ou substabelecimento já é suficiente.", "D": "Incorreta. Não há essa exigência de tempo mínimo de inscrição — e a questão trata de estagiário, não de advogado."}, "fund": "Art. 29, §2º, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Distinga bem: atos JUDICIAIS isolados → só os 3 do art. 29, §1º (retirar autos, obter certidões, assinar petição de juntada), independentemente de autorização específica, apenas sob responsabilidade do advogado. Atos EXTRAJUDICIAIS (cartórios, repartições públicas, órgãos administrativos) → o estagiário pode comparecer sozinho sempre que tiver AUTORIZAÇÃO ou SUBSTABELECIMENTO expresso do advogado — aqui o rol é mais aberto, desde que documentado."}, {"num": 12, "exame": "CESPE – estilo", "titulo": "Estágio na Defensoria Pública", "enunciado": "Um estudante de Direito realiza estágio na Defensoria Pública do Estado, nos termos da Lei Complementar n. 80/1994, e deseja utilizar esse período para fins de inscrição no quadro de estagiários da OAB.", "comando": "Segundo o Regulamento Geral do Estatuto da Advocacia, esse estágio na Defensoria Pública:", "alt": {"A": "Não é válido para fins de inscrição no quadro de estagiários da OAB, por se tratar de órgão distinto da advocacia privada.", "B": "é considerado válido para fins de inscrição no quadro de estagiários da OAB.", "C": "só é válido se o estudante também estagiar simultaneamente em escritório privado.", "D": "é válido apenas para fins de estágio curricular obrigatório da faculdade, sem qualquer efeito perante a OAB."}, "gabarito": "B", "fb": {"A": "Incorreta. É exatamente o oposto: a lei reconhece expressamente a validade desse estágio para fins de inscrição na OAB.", "B": "Correta! Art. 28, Regulamento Geral: “O estágio realizado na Defensoria Pública da União, do Distrito Federal ou dos Estados, na forma do artigo 145 da Lei Complementar n. 80, de 12 de janeiro de 1994, é considerado válido para fins de inscrição no quadro de estagiários da OAB”.", "C": "Incorreta. Não há essa exigência de estagiar simultaneamente em dois lugares.", "D": "Incorreta. O estágio na Defensoria tem efeito expresso também perante a OAB, não apenas perante a faculdade."}, "fund": "Art. 28, Regulamento Geral do Estatuto da Advocacia e da OAB; art. 145, Lei Complementar 80/1994.", "caqui": "Boa notícia para quem estagia na Defensoria: esse período CONTA normalmente para fins de inscrição como estagiário da OAB, exatamente como o estágio em escritório privado ou em outro órgão jurídico credenciado. A lógica é a mesma: o que importa é a prática jurídica supervisionada, não a natureza pública ou privada do local do estágio."}, {"num": 13, "exame": "OAB – estilo FGV", "titulo": "Comissão de Estágio e Exame de Ordem", "enunciado": "Cada Conselho Seccional da OAB mantém um órgão interno responsável por coordenar e fiscalizar as atividades relacionadas ao estágio profissional.", "comando": "Segundo o Regulamento Geral do Estatuto da Advocacia, esse órgão é denominado:", "alt": {"A": "Comissão de Ética e Disciplina.", "B": "Comissão de Estágio e Exame de Ordem.", "C": "Tribunal de Ética Profissional.", "D": "Comissão de Prerrogativas."}, "gabarito": "B", "fb": {"A": "Incorreta. A Comissão de Ética e Disciplina cuida de processos disciplinares em geral, não especificamente do estágio.", "B": "Correta! Art. 31, Regulamento Geral: “Cada Conselho Seccional mantém uma Comissão de Estágio e Exame de Ordem, a quem incumbe coordenar, fiscalizar e executar as atividades decorrentes do estágio profissional”.", "C": "Incorreta. O Tribunal de Ética e Disciplina julga infrações éticas, não coordena o estágio.", "D": "Incorreta. A Comissão de Prerrogativas cuida da defesa das prerrogativas profissionais, não do estágio."}, "fund": "Art. 31, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "A Comissão de Estágio e Exame de Ordem (CEEO) é o órgão que, na prática, organiza o Exame de Ordem em cada Seccional e também fiscaliza os convênios de estágio, credenciamento de escritórios/instituições e o cumprimento das regras do estágio profissional. Não confunda com a Comissão de Ética/Tribunal de Ética (julga infrações disciplinares) nem com a Comissão de Prerrogativas (defende direitos de advogados em casos de violação)."}, {"num": 14, "exame": "CESPE – estilo", "titulo": "Estágio Realizado Integralmente Fora da Instituição de Ensino", "enunciado": "Um estagiário realiza todo o seu estágio profissional em um escritório de advocacia credenciado pela OAB, sem qualquer atividade complementar na própria faculdade.", "comando": "Segundo o art. 30 do Regulamento Geral do Estatuto da Advocacia, esse estágio:", "alt": {"A": "é vedado, pois o estágio deve ser sempre parcialmente realizado dentro da instituição de ensino.", "B": "compreende as atividades fixadas em convênio entre o escritório de advocacia (ou órgão jurídico credenciado) e as demais partes envolvidas, incluindo rotinas processuais e atuação em audiências e sessões.", "C": "não é válido para fins de inscrição na OAB, exigindo-se sempre atividade acadêmica complementar.", "D": "só pode ser realizado por até seis meses, com renovação obrigatória pela instituição de ensino."}, "gabarito": "B", "fb": {"A": "Incorreta. O art. 30 admite expressamente o estágio realizado INTEGRALMENTE fora da instituição de ensino, ou seja, inteiramente no escritório/órgão credenciado.", "B": "Correta! Art. 30, Regulamento Geral: o estágio profissional de advocacia, realizado integralmente fora da instituição de ensino, compreende as atividades fixadas em convênio, entre elas a redação de atos processuais e profissionais, as rotinas processuais, a assistência e a atuação em audiências e sessões, as visitas a órgãos judiciários, a prestação de serviços jurídicos e as técnicas de negociação coletiva, de arbitragem, entre outras.", "C": "Incorreta. É exatamente o oposto — esse modelo (estágio integralmente externo) é válido para fins de inscrição.", "D": "Incorreta. Não há esse limite de seis meses na lei."}, "fund": "Art. 30, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Isso mostra que existem, basicamente, dois modelos de estágio: (1) o estágio-DISCIPLINA, ministrado pela própria faculdade (núcleo de prática jurídica, com carga horária curricular específica); e (2) o estágio EXTRACURRICULAR/profissional, realizado inteiramente em escritório ou órgão jurídico credenciado pela OAB, regido por convênio próprio. Ambos são válidos para fins de inscrição como estagiário, desde que cumpridos os requisitos legais."}, {"num": 15, "exame": "OAB – estilo FGV", "titulo": "Estudo Obrigatório do Estatuto e do Código de Ética", "enunciado": "Durante o estágio profissional de advocacia, o Estatuto exige que determinadas matérias sejam necessariamente estudadas pelo estagiário.", "comando": "Segundo o art. 9º, §1º, do Estatuto da Advocacia, são objeto de estudo obrigatório durante o estágio:", "alt": {"A": "Apenas o Regimento Interno do Tribunal onde o estagiário atua.", "B": "O Estatuto da Advocacia e da OAB e o Código de Ética e Disciplina.", "C": "Somente o Código de Processo Civil, por ser a matéria mais cobrada no Exame de Ordem.", "D": "Não há exigência legal de estudo específico durante o estágio."}, "gabarito": "B", "fb": {"A": "Incorreta. Não é essa a exigência legal específica do art. 9º, §1º.", "B": "Correta! Art. 9º, §1º, Lei 8.906/94, parte final: “(...) sendo obrigatório o estudo deste Estatuto e do Código de Ética e Disciplina”. A lei destaca esses dois diplomas como conteúdo essencial da formação do estagiário, já durante o período de prática profissional.", "C": "Incorreta. Não há essa exigência específica na lei, embora seja matéria relevante na prática forense.", "D": "Incorreta. Há sim exigência expressa de estudo do Estatuto e do Código de Ética."}, "fund": "Art. 9º, §1º, parte final, Lei 8.906/94.", "caqui": "Faz todo sentido pedagógico: a lei quer que o futuro advogado já internalize, DESDE O ESTÁGIO, os valores éticos e as regras estatutárias da profissão — não apenas o conteúdo técnico-processual. É justamente essa formação ética precoce que fundamenta a exigência de que o estagiário também se submeta às normas deontológicas da advocacia, mesmo antes de virar advogado."}, {"num": 16, "exame": "CESPE – estilo", "titulo": "Documentos de Identidade Profissional do Estagiário", "enunciado": "Um estagiário inscrito na OAB deseja comprovar sua condição para exercer as atividades práticas do estágio em juízo.", "comando": "Segundo o Regulamento Geral do Estatuto da Advocacia, os documentos de identidade profissional de uso obrigatório pelo estagiário inscrito são:", "alt": {"A": "Apenas a carteira de identidade civil comum (RG).", "B": "A carteira e o cartão emitidos pela OAB, sendo que o uso do cartão dispensa o da carteira.", "C": "Somente o cartão de matrícula da faculdade de Direito.", "D": "Não há exigência de documento específico, bastando a apresentação de qualquer documento com foto."}, "gabarito": "B", "fb": {"A": "Incorreta. O documento específico exigido é o emitido pela própria OAB, não o RG comum.", "B": "Correta! Art. 32, Regulamento Geral: “São documentos de identidade profissional a carteira e o cartão emitidos pela OAB, de uso obrigatório pelos advogados e estagiários inscritos, para o exercício de suas atividades”, com parágrafo único estabelecendo que “o uso do cartão dispensa o da carteira”.", "C": "Incorreta. O cartão de matrícula da faculdade não substitui o documento profissional emitido pela OAB.", "D": "Incorreta. Há exigência específica de documento emitido pela OAB (carteira ou cartão)."}, "fund": "Art. 32 e parágrafo único, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Regra prática simples: o estagiário, assim como o advogado, precisa portar sua carteira OU cartão da OAB para exercer atividades práticas (protocolar petição, entrar em cartório, acessar sistemas eletrônicos). Os dois documentos têm a mesma finalidade — usar um dispensa o outro, não é necessário portar ambos simultaneamente."}, {"num": 17, "exame": "OAB – estilo FGV", "titulo": "Sigilo Profissional Aplicável ao Estagiário", "enunciado": "Um estagiário, no exercício de suas atividades em um escritório, toma conhecimento de informações sigilosas sobre a vida pessoal de um cliente, relacionadas à causa em que atua sob supervisão do advogado.", "comando": "Sobre o dever de sigilo do estagiário nessa situação, é correto afirmar que:", "alt": {"A": "Não se aplica ao estagiário, por não ser ainda advogado inscrito nos quadros definitivos da OAB.", "B": "O estagiário, ao estudar obrigatoriamente o Estatuto e o Código de Ética durante o estágio (art. 9º, §1º) e atuar sob responsabilidade do advogado, deve observar os mesmos deveres de sigilo profissional inerentes à atividade, sob pena de responsabilização.", "C": "Só se aplica se o estagiário for remunerado pelo escritório.", "D": "é dispensável sempre que o cliente autorizar verbalmente a divulgação."}, "gabarito": "B", "fb": {"A": "Incorreta. O sigilo protege o CLIENTE e a confiança na advocacia como um todo — não depende do estagiário já ser advogado inscrito definitivamente.", "B": "Correta! Como o estagiário atua sob a responsabilidade do advogado (art. 3º, §2º) e está submetido ao estudo obrigatório do Estatuto e do Código de Ética (art. 9º, §1º), ele integra a cadeia de confiança profissional protegida pelo sigilo — devendo observar os mesmos deveres deontológicos de reserva sobre informações de clientes obtidas em razão do estágio.", "C": "Incorreta. O dever de sigilo não depende de remuneração — decorre da própria natureza da atividade exercida, mesmo em estágio não remunerado.", "D": "Incorreta. Uma autorização verbal informal não afasta, por si só, o dever ético de sigilo, que existe justamente para proteger o cliente de exposições inadequadas, mesmo com aparente consentimento pontual."}, "fund": "Art. 3º, §2º, e art. 9º, §1º, Lei 8.906/94; princípios do sigilo profissional do Código de Ética e Disciplina da OAB.", "caqui": "A lógica é a mesma que vimos no material do advogado empregado: quem atua na advocacia, mesmo sob supervisão e sem ainda ser advogado formalmente inscrito, absorve os deveres éticos básicos da profissão — sigilo, lealdade, boa-fé. O estagiário não é “meio advogado” nem está fora do sistema ético da advocacia; ele já está inserido nessa cadeia de responsabilidade, ainda que de forma subordinada e supervisionada."}, {"num": 18, "exame": "CESPE – estilo", "titulo": "Consequências da Atuação Irregular do Estagiário", "enunciado": "Um estagiário, sem qualquer autorização ou acompanhamento de advogado, comparece sozinho a uma audiência de instrução e julgamento e passa a fazer perguntas às testemunhas em nome do cliente.", "comando": "Essa conduta:", "alt": {"A": "é regular, pois o estagiário inscrito tem plena capacidade postulatória em audiências.", "B": "extrapola os limites de atuação isolada permitidos ao estagiário, configurando exercício irregular da profissão e podendo sujeitar tanto o estagiário quanto o advogado responsável a responsabilização.", "C": "é regular, desde que o estagiário esteja no último ano do curso jurídico.", "D": "só gera consequências se o cliente reclamar formalmente."}, "gabarito": "B", "fb": {"A": "Incorreta. Atuação em audiência de instrução (formulando perguntas, representando a parte) NÃO está entre os atos que o estagiário pode praticar isoladamente (art. 29, §1º, Regulamento Geral) — exige a atuação conjunta e a presença do advogado.", "B": "Correta! Ao atuar sozinho em audiência, formulando perguntas e representando substancialmente o cliente, o estagiário extrapola o limite legal de atuação conjunta/subordinada (art. 3º, §2º, EOAB), configurando possível exercício irregular da profissão, com repercussões éticas e até processuais (nulidade de atos), podendo também comprometer o advogado que deveria ter acompanhado o ato.", "C": "Incorreta. Não há essa exceção baseada no período cursado — a exigência de acompanhamento vale durante todo o estágio, independentemente do semestre cursado.", "D": "Incorreta. As consequências éticas e processuais podem surgir independentemente de reclamação expressa do cliente — inclusive de ofício, pelo próprio juízo ou pela OAB."}, "fund": "Art. 3º, §2º, Lei 8.906/94; art. 29, §§1º e 2º, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Fixe a regra prática: sempre que a atuação do estagiário envolver REPRESENTAÇÃO SUBSTANCIAL da parte em ato processual relevante (audiência, sustentação oral, formulação de perguntas, negociação de acordo), é exigida a presença do advogado. Os atos isolados permitidos ao estagiário são sempre BUROCRÁTICOS ou COM AUTORIZAÇÃO ESPECÍFICA, nunca atos de representação substantiva da parte em contraditório."}, {"num": 19, "exame": "OAB – estilo FGV", "titulo": "Estágio Curricular Acadêmico x Estágio Profissional da OAB", "enunciado": "Um estudante de Direito cumpre, na sua faculdade, a disciplina obrigatória de “Prática Jurídica”, regida pela Lei 11.788/2008 (Lei de Estágio), sem ainda ter se inscrito como estagiário na OAB.", "comando": "Sobre essa situação, é correto afirmar que:", "alt": {"A": "O estágio curricular acadêmico da Lei 11.788/2008 e o estágio profissional de advocacia do Estatuto da OAB são o mesmo instituto, com regras idênticas.", "B": "São institutos distintos: o estágio curricular acadêmico é disciplinado pela Lei 11.788/2008 (ato educativo escolar supervisionado, sem necessidade de inscrição na OAB), enquanto o estágio profissional de advocacia, para fins de prática de atos privativos e inscrição como estagiário, é regido pelo Estatuto da Advocacia (Lei 8.906/94).", "C": "A inscrição na OAB é automática assim que o estudante inicia qualquer estágio curricular na faculdade.", "D": "O estágio da Lei 11.788/2008 substitui integralmente a necessidade de inscrição como estagiário para a prática de atos privativos da advocacia."}, "gabarito": "B", "fb": {"A": "Incorreta. São regimes distintos, com finalidades e regras próprias, embora possam se sobrepor na prática quando o estagiário de escritório também se inscreve na OAB.", "B": "Correta! A Lei 11.788/2008 disciplina o estágio como ATO EDUCATIVO ESCOLAR SUPERVISIONADO, aplicável a estudantes de qualquer curso, sem necessidade de inscrição em conselho profissional. Já o estágio PROFISSIONAL DE ADVOCACIA, especificamente disciplinado pelo Estatuto da Advocacia (arts. 3º, §2º, e 9º, Lei 8.906/94), exige inscrição própria na OAB para que o estudante possa praticar atos privativos da advocacia, ainda que em conjunto com advogado.", "C": "Incorreta. A inscrição na OAB NÃO é automática — exige requerimento específico e cumprimento dos requisitos do art. 9º.", "D": "Incorreta. Para PRATICAR atos privativos da advocacia (mesmo em conjunto com advogado), é necessária a inscrição específica como estagiário na OAB — o mero estágio curricular da Lei 11.788/2008, isoladamente, não autoriza essa prática."}, "fund": "Lei 11.788/2008 (Lei de Estágio); art. 3º, §2º, e art. 9º, Lei 8.906/94.", "caqui": "Pense assim: TODO estagiário de advocacia inscrito na OAB também se enquadra, para fins trabalhistas/previdenciários, nas regras gerais da Lei 11.788/2008 (termo de compromisso, seguro contra acidentes, carga horária máxima etc.) — mas NEM TODO estagiário da Lei 11.788/2008 (poderia ser de qualquer curso) está automaticamente inscrito e habilitado a praticar atos privativos da advocacia. Para isso, precisa especificamente da inscrição própria prevista no Estatuto da Advocacia."}, {"num": 20, "exame": "CESPE – estilo", "titulo": "Ausência de Vínculo Empregatício no Estágio", "enunciado": "Uma empresa contrata um estagiário de Direito, mas passa a exigir dele metas de produtividade idênticas às dos empregados efetivos, com subordinação plena e sem qualquer supervisão pedagógica real.", "comando": "Nessa hipótese, à luz da Lei 11.788/2008 e da primazia da realidade:", "alt": {"A": "Não há qualquer risco jurídico, pois o termo de estágio, uma vez assinado, blinda a empresa definitivamente.", "B": "O desvirtuamento do estágio (falta de finalidade pedagógica, subordinação típica de emprego) pode levar ao reconhecimento judicial de vínculo empregatício, com todos os direitos trabalhistas decorrentes.", "C": "Só gera consequências se o estágio ultrapassar 5 anos de duração.", "D": "É sempre lícito, pois estagiários não têm proteção trabalhista de espécie alguma."}, "gabarito": "B", "fb": {"A": "Incorreta. O termo formal de estágio NÃO blinda a empresa se, na prática, os fatos demonstrarem desvio de finalidade (primazia da realidade).", "B": "Correta! A Lei 11.788/2008 exige que o estágio tenha finalidade pedagógica efetiva, com acompanhamento e supervisão. Quando isso é desvirtuado — exigência de metas, subordinação idêntica à de empregado, ausência de real orientação pedagógica — a Justiça do Trabalho pode reconhecer o vínculo empregatício, com o pagamento retroativo de verbas trabalhistas (FGTS, férias, 13º salário etc.), aplicando a mesma lógica da primazia da realidade vista para o advogado empregado.", "C": "Incorreta. Não há esse limite temporal específico como único critério — o que importa é a presença ou ausência dos elementos caracterizadores do desvirtuamento.", "D": "Incorreta. Estagiários TÊM proteções específicas na Lei 11.788/2008 (jornada máxima, bolsa-auxílio quando obrigatória, seguro contra acidentes, recesso remunerado), e podem ter o vínculo reconhecido como emprego se a lei for desrespeitada."}, "fund": "Lei 11.788/2008, arts. 3º e 15; princípio da primazia da realidade (Direito do Trabalho).", "caqui": "Esse tema conecta diretamente com o que vimos no banco de Advogado Empregado: assim como a “associação” disfarçada pode virar vínculo de emprego reconhecido judicialmente, o “estágio” desvirtuado (sem finalidade pedagógica real) também pode. A lógica é sempre a mesma: os FATOS prevalecem sobre o rótulo contratual dado pelas partes."}, {"num": 21, "exame": "OAB – estilo FGV", "titulo": "Estágio e Incompatibilidade Superveniente", "enunciado": "Um estagiário regularmente inscrito na OAB é aprovado em concurso público para o cargo de delegado de polícia, tomando posse imediatamente.", "comando": "Nesse caso, em relação à sua inscrição como estagiário na OAB:", "alt": {"A": "Permanece inalterada, pois a incompatibilidade só se aplica a advogados já inscritos definitivamente.", "B": "Deve ser regularizada perante a OAB, uma vez que a atividade de delegado é incompatível com a advocacia (inclusive na condição de estagiário), sujeitando-se às consequências previstas no Estatuto para essa hipótese.", "C": "Torna-se automaticamente advogado, dispensado do Exame de Ordem, em razão do cargo público assumido.", "D": "Não gera qualquer consequência, pois delegado de polícia não exerce atividade jurídica."}, "gabarito": "B", "fb": {"A": "Incorreta. Como visto no art. 9º, §3º, a incompatibilidade também impede a inscrição (e a manutenção da inscrição) como ESTAGIÁRIO, não apenas como advogado.", "B": "Correta! A incompatibilidade superveniente (assunção de cargo incompatível com a advocacia, como delegado de polícia) exige a regularização da situação do estagiário perante a OAB, aplicando-se, no que couber, a mesma lógica das incompatibilidades que atingem advogados já inscritos.", "C": "Incorreta. Não há conversão automática em advogado por assunção de cargo público — a inscrição definitiva continua exigindo aprovação no Exame de Ordem e os demais requisitos do art. 8º.", "D": "Incorreta. Delegado de polícia é justamente uma das atividades classicamente apontadas como incompatíveis com a advocacia, por envolver atividades de investigação e poder de polícia."}, "fund": "Art. 9º, §3º, Lei 8.906/94, aplicado por analogia às incompatibilidades supervenientes; regime geral de incompatibilidades do Estatuto (art. 28 e seguintes).", "caqui": "A lógica das incompatibilidades é sempre PREVENTIVA e CONTÍNUA: não basta não ter incompatibilidade no momento da inscrição inicial — se ela surgir DEPOIS (incompatibilidade superveniente), a situação do inscrito (seja estagiário, seja advogado) precisa ser regularizada. A ideia é sempre a mesma: preservar a independência e a isenção da advocacia frente a atividades que possam gerar conflito de interesses ou risco à imparcialidade."}, {"num": 22, "exame": "CESPE – estilo", "titulo": "Responsabilidade do Advogado pela Atuação do Estagiário", "enunciado": "Um estagiário, atuando em conjunto com o advogado responsável, comete um erro grosseiro na redação de uma petição, que é subscrita também pelo advogado, causando prejuízo ao cliente.", "comando": "Nessa hipótese, à luz do art. 3º, §2º, do Estatuto da Advocacia, a responsabilidade:", "alt": {"A": "é exclusiva do estagiário, já que foi ele quem redigiu materialmente a petição.", "B": "recai, em regra, sobre o advogado, pois o estagiário atua “em conjunto com advogado e sob responsabilidade deste”.", "C": "é sempre solidária e idêntica entre estagiário e advogado, sem qualquer distinção.", "D": "é exclusivamente da instituição de ensino que mantém o estágio."}, "gabarito": "B", "fb": {"A": "Incorreta. A própria redação legal atribui a responsabilidade ao advogado, justamente por ser ele quem supervisiona e subscreve o ato em conjunto com o estagiário.", "B": "Correta! Art. 3º, §2º, Lei 8.906/94: o estagiário pratica os atos do art. 1º “em conjunto com advogado e SOB RESPONSABILIDADE DESTE”. Isso significa que, em regra, o advogado responsável assume a responsabilidade técnica e ética pelos atos praticados em conjunto com o estagiário sob sua supervisão, embora o estagiário também possa responder, a depender do grau de participação e culpa evidenciados no caso concreto.", "C": "Incorreta. Não há essa equiparação automática e idêntica — a lei estabelece expressamente a responsabilidade do advogado como regra.", "D": "Incorreta. A instituição de ensino não assume, por si só, a responsabilidade pelos atos profissionais praticados no estágio realizado em escritório ou órgão jurídico."}, "fund": "Art. 3º, §2º, Lei 8.906/94.", "caqui": "Essa é exatamente a razão pela qual a lei exige que os atos do estagiário sejam praticados “em conjunto” com o advogado: o supervisor não é um mero espectador, ele responde tecnicamente pelo trabalho do estagiário sob sua orientação. Por isso a atuação do estagiário sozinho, fora das hipóteses isoladas do Regulamento Geral, é tão problemática — rompe essa cadeia de supervisão e responsabilidade que a lei quer preservar."}, {"num": 23, "exame": "OAB – estilo FGV", "titulo": "Estágio como Etapa de Formação para a Advocacia", "enunciado": "Considerando toda a disciplina do estágio profissional de advocacia no Estatuto da OAB, analise as afirmativas:\n\nI. O estagiário pode praticar QUALQUER ato privativo da advocacia sozinho, desde que esteja no último ano do curso.\nII. O estágio profissional, em regra, tem duração de dois anos, realizado nos últimos anos do curso jurídico.\nIII. A inscrição do estagiário é feita no Conselho Seccional em cujo território se localiza seu curso jurídico.\nIV. Em situações excepcionais declaradas pelo poder público, o estágio pode ser realizado em regime de teletrabalho, sem configurar vínculo de emprego.", "comando": "Estão corretas apenas as afirmativas:", "alt": {"A": "I e III.", "B": "II, III e IV.", "C": "I, II e IV.", "D": "I, II, III e IV."}, "gabarito": "B", "fb": {"A": "Incorreta. A afirmativa I está errada — não há essa exceção genérica para o último ano do curso; o rol de atos isolados é taxativo e independe do período cursado.", "B": "Correta! II está correta (art. 9º, §1º: duração de 2 anos, nos últimos anos do curso). III está correta (art. 9º, §2º: inscrição no Conselho Seccional do local do curso). IV está correta (art. 9º, §5º, incluído pela Lei 14.365/2022: teletrabalho em situações excepcionais, sem vínculo de emprego). I está errada, pelos motivos já explicados.", "C": "Incorreta. A afirmativa I está errada; apenas II e IV, dentre as citadas nesta alternativa, estão corretas.", "D": "Incorreta. A afirmativa I está errada."}, "fund": "Arts. 3º, §2º, e 9º, §§1º, 2º e 5º, Lei 8.906/94; art. 29, Regulamento Geral.", "caqui": "Questão-síntese perfeita para revisar tudo: sempre que uma alternativa disser que o estagiário pode praticar “qualquer ato” sozinho, ou que tem “os mesmos poderes” do advogado, desconfie imediatamente — essa é a pegadinha mais recorrente do tema. Grave os números-chave: 2 anos (duração do estágio de graduando), Conselho Seccional do curso (critério de inscrição), e a novidade de 2022 sobre teletrabalho em situações excepcionais."}, {"num": 24, "exame": "CESPE – estilo", "titulo": "Estágio como Requisito Indireto para a Advocacia", "enunciado": "Embora o estágio profissional de advocacia não seja formalmente exigido como pré-requisito para a inscrição como advogado (que depende de diploma e aprovação no Exame de Ordem), ele desempenha papel relevante na formação prática do futuro profissional.", "comando": "Sobre essa afirmação, é correto dizer que:", "alt": {"A": "Está incorreta, pois o estágio profissional de advocacia é requisito legal obrigatório para a inscrição como advogado, sem o qual o diploma não é válido.", "B": "Está correta: os requisitos legais para inscrição como advogado (art. 8º) não incluem, entre seus incisos, a exigência formal de estágio prévio na OAB, embora o estágio seja extremamente relevante como formação prática e cumpra papel pedagógico importante.", "C": "Está incorreta, pois o estágio substitui integralmente a exigência de aprovação no Exame de Ordem.", "D": "Está correta apenas para os cursos de Direito públicos, sendo obrigatório nos cursos privados."}, "gabarito": "B", "fb": {"A": "Incorreta. O art. 8º, que lista os requisitos para inscrição como advogado, NÃO inclui o estágio prévio como requisito formal expresso — os requisitos são capacidade civil, diploma, título de eleitor/quitação militar, aprovação no Exame de Ordem, não exercer atividade incompatível, idoneidade moral e prestação de compromisso.", "B": "Correta! Embora extremamente relevante na prática (e frequentemente exigido de forma indireta, por meio de estágios curriculares obrigatórios das próprias faculdades de Direito, regidos pela Lei 11.788/2008), o estágio profissional ESPECÍFICO da OAB não é, tecnicamente, requisito listado no art. 8º do Estatuto para a inscrição definitiva como advogado.", "C": "Incorreta. O estágio não substitui a aprovação no Exame de Ordem, que continua sendo requisito autônomo e obrigatório (art. 8º, IV).", "D": "Incorreta. Não há essa distinção entre cursos públicos e privados na regulamentação federal do estágio."}, "fund": "Art. 8º, Lei 8.906/94 (rol de requisitos para inscrição como advogado, sem menção a estágio prévio na OAB); Lei 11.788/2008 (estágio curricular, frequentemente exigido pelas próprias faculdades como requisito de colação de grau).", "caqui": "Cuidado com essa pegadinha sutil: MUITAS faculdades exigem, curricularmente, que o aluno cumpra horas de prática jurídica/estágio para se formar (requisito acadêmico da própria instituição de ensino, com base na Lei 11.788/2008 e nas diretrizes curriculares do curso de Direito) — mas isso é diferente de dizer que o Estatuto da OAB (art. 8º) exige estágio prévio ESPECÍFICO NA ORDEM como condição formal para a inscrição como advogado. Os requisitos da inscrição definitiva estão taxativamente no art. 8º, e o estágio na OAB não está entre eles."}, {"num": 25, "exame": "OAB – estilo FGV", "titulo": "Questão Síntese – Ética do Estagiário", "enunciado": "Sobre o regime jurídico do estagiário de advocacia, considerando o Estatuto da Advocacia (Lei 8.906/94), com as alterações da Lei 14.365/2022, e o Regulamento Geral do Estatuto, assinale a alternativa correta.", "comando": "Assinale a alternativa correta sobre o regime jurídico do estagiário de advocacia.", "alt": {"A": "O estagiário, uma vez inscrito na OAB, pode praticar livremente todos os atos privativos da advocacia, sem necessidade de acompanhamento do advogado em qualquer hipótese.", "B": "O estagiário, regularmente inscrito, pratica os atos do art. 1º do Estatuto em conjunto com advogado e sob responsabilidade deste, ressalvados os poucos atos isolados expressamente previstos no Regulamento Geral, sendo-lhe também aplicáveis, desde 2022, regras específicas sobre teletrabalho em situações excepcionais.", "C": "A inscrição do estagiário exige diploma de graduação em Direito e aprovação no Exame de Ordem.", "D": "O aluno que exerce atividade incompatível com a advocacia pode se inscrever normalmente como estagiário na OAB."}, "gabarito": "B", "fb": {"A": "Incorreta. É exatamente o oposto do regime legal — a regra é a atuação CONJUNTA com o advogado (art. 3º, §2º), com pouquíssimas exceções isoladas.", "B": "Correta! Resume corretamente o regime: atuação conjunta com advogado como regra (art. 3º, §2º), exceções taxativas do Regulamento Geral (art. 29, §§1º e 2º), e a novidade da Lei 14.365/2022 sobre teletrabalho em situações excepcionais (art. 9º, §5º).", "C": "Incorreta. Diploma e aprovação no Exame de Ordem são exigidos para o ADVOGADO (art. 8º, II e IV), não para o estagiário (art. 9º, I, exclui expressamente esses dois incisos).", "D": "Incorreta. É exatamente o oposto: a inscrição é VEDADA para quem exerce atividade incompatível (art. 9º, §3º), podendo apenas frequentar o estágio da própria instituição de ensino para aprendizagem."}, "fund": "Arts. 3º, §2º, e 9º, I e §§1º a 6º, Lei 8.906/94; art. 29, Regulamento Geral do Estatuto da Advocacia e da OAB.", "caqui": "Fechando o tema com essa questão-síntese: o estagiário é uma figura de TRANSIÇÃO na carreira jurídica — já tem alguns poderes de atuação prática, mas sempre de forma SUBORDINADA e SUPERVISIONADA pelo advogado. A lógica de toda a disciplina legal gira em torno de duas ideias: (1) PROTEGER o cliente, garantindo que um profissional ainda em formação não assuma sozinho responsabilidades que exigem plena habilitação; e (2) FORMAR o futuro advogado, dando a ele experiência prática progressiva, sempre sob a asa protetora do advogado responsável."}];
let cur=0,N=QUESTOES.length;
const E=Array(N).fill(null);
function init(){
  const nw=document.getElementById('nw'),ct=document.getElementById('ct');
  QUESTOES.forEach((q,i)=>{
    const b=document.createElement('button');
    b.className='nb'+(i===0?' active':'');b.textContent=i+1;b.onclick=()=>go(i);b.id='n'+i;nw.appendChild(b);
    const d=document.createElement('div');d.className='qc'+(i===0?' vis':'');d.id='c'+i;d.innerHTML=bc(q,i);ct.appendChild(d);
  });upd();us();
}
function bc(q,i){
  const al=Object.entries(q.alt).map(([l,t])=>`<button class="ab" onclick="resp(${i},'${l}',this)" data-l="${l}"><span class="all">${l}</span><span class="alt">${t}</span></button>`).join('');
  return `<div class="qh"><span class="qn">Questão ${q.num}</span>${q.exame?`<span class="qe">${q.exame}</span>`:''}</div><h2 class="qt">${q.titulo}</h2><div class="en">${q.enunciado}</div><p class="co">${q.comando}</p><div class="al" id="a${i}">${al}</div><div class="fb" id="f${i}"></div><div class="fu" id="u${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div><div class="cx" id="x${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div><div class="ca"><div class="bg"><button class="btn az" id="bu${i}" onclick="tF(${i})">Ver fundamento legal</button><button class="btn cq" id="bx${i}" onclick="tX(${i})">Explicação do Prof. Caqui</button><button class="btn" id="br${i}" onclick="rst(${i})">↺ Tentar novamente</button></div><span class="st" id="s${i}"></span></div>`;
}
function resp(i,l,btn){
  if(E[i]!==null)return;E[i]=l;const q=QUESTOES[i];
  document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=true;if(b.dataset.l===q.gabarito)b.classList.add('cor');if(b.dataset.l===l&&l!==q.gabarito)b.classList.add('err');});
  const ok=l===q.gabarito,f=document.getElementById('f'+i);
  f.className='fb sh '+(ok?'ac':'er');f.innerHTML=`<strong>${ok?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[l]}`;
  document.getElementById('s'+i).textContent=ok?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('br'+i).className='btn sh';document.getElementById('bu'+i).className='btn az sh';document.getElementById('bx'+i).className='btn cq sh';
  const nb=document.getElementById('n'+i);nb.classList.remove('active');nb.classList.add(ok?'ok':'no');if(i===cur)nb.classList.add('active');us();
}
function tF(i){const b=document.getElementById('u'+i),t=document.getElementById('bu'+i),v=b.classList.contains('sh');b.className=v?'fu':'fu sh';t.textContent=v?'Ver fundamento legal':'Ocultar fundamento';}
function tX(i){const b=document.getElementById('x'+i),t=document.getElementById('bx'+i),v=b.classList.contains('sh');b.className=v?'cx':'cx sh';t.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';}
function rst(i){
  E[i]=null;document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=false;b.className='ab';});
  document.getElementById('f'+i).className='fb';document.getElementById('u'+i).className='fu';
  document.getElementById('bu'+i).className='btn az';document.getElementById('bu'+i).textContent='Ver fundamento legal';
  document.getElementById('x'+i).className='cx';document.getElementById('bx'+i).className='btn cq';document.getElementById('bx'+i).textContent='Explicação do Prof. Caqui';
  document.getElementById('br'+i).className='btn';document.getElementById('s'+i).textContent='';
  document.getElementById('n'+i).className='nb'+(i===cur?' active':'');us();
}
function go(i){document.getElementById('c'+cur).classList.remove('vis');document.getElementById('n'+cur).classList.remove('active');cur=i;document.getElementById('c'+cur).classList.add('vis');document.getElementById('n'+cur).classList.add('active');upd();window.scrollTo({top:0,behavior:'smooth'});}
function nav(d){const n=cur+d;if(n>=0&&n<N)go(n);}
function upd(){document.getElementById('pi').textContent=(cur+1)+' de '+N;document.getElementById('bp').disabled=cur===0;document.getElementById('bn').disabled=cur===N-1;}
function us(){const r=E.filter(e=>e!==null).length,a=E.filter((e,i)=>e===QUESTOES[i].gabarito).length;document.getElementById('sc-t').textContent=r;document.getElementById('sc-a').textContent=a;document.getElementById('sc-e').textContent=r-a;const p=Math.round((r/N)*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pl').textContent=r+' de '+N+' respondidas';}
init();
</script>
</body>
</html>
