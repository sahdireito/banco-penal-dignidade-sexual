<script>
const QUESTOES = [
  {num:1, exame:"XLIV Exame — 2025", titulo:"Importunação Sexual — Distinção de Tipos Penais", enunciado:"Matheus foi a uma festa de réveillon onde reencontrou sua ex-namorada, Laís, sendo ambos maiores e capazes. Em determinado momento, Matheus, sem a anuência de Laís, acariciou suas nádegas e tentou beijá-la, para satisfazer sua própria lascívia.", comando:"Acerca da tipificação da conduta de Matheus, assinale a afirmativa correta.", gabarito:"D", alt:{"A": "É fato atípico.", "B": "É crime de estupro.", "C": "É crime de assédio sexual.", "D": "É crime de importunação sexual."}, fb:{"A": "Incorreta. A conduta é típica e expressamente prevista no art. 215-A do Código Penal.", "B": "Incorreta. O estupro (art. 213, CP) exige violência ou grave ameaça. No caso, não houve nem uma nem outra.", "C": "Incorreta. O assédio sexual (art. 216-A, CP) exige relação de hierarquia ou ascendência funcional. Não há isso entre ex-namorados.", "D": "Correta! Art. 215-A, CP: praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer a própria lascívia ou a de terceiro. Matheus praticou ato libidinoso (carícia nas nádegas + tentativa de beijo) sem o consentimento de Laís, visando satisfazer sua lascívia. Todos os elementos do tipo estão presentes."}, fund:"Art. 215-A, CP (incluído pela Lei 13.718/2018): praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer a própria lascívia ou a de terceiro. Pena: reclusão de 1 a 5 anos, se o ato não constitui crime mais grave.", caqui:"Triângulo dos crimes sexuais para a OAB: ESTUPRO (art. 213) = violência OU grave ameaça. ASSÉDIO SEXUAL (art. 216-A) = relação hierárquica/funcional. IMPORTUNAÇÃO SEXUAL (art. 215-A) = ato libidinoso sem consentimento, sem violência, sem hierarquia. Matheus não usou força, não é chefe de Laís — logo, importunação sexual."},
  {num:2, exame:"42º Exame — 2024", titulo:"Erro de Proibição Direto — Compartilhamento de Material Sexual", enunciado:"Caio compartilhou vídeos e fotos pornográficos em um grupo de amigos. O material continha imagens extraídas ilegalmente de computadores pessoais por terceiros, já tendo sido objeto de registros policiais pelas vítimas. O Delegado indiciou Caio pelo crime do Art. 218-C do Código Penal (compartilhamento não autorizado de cena de sexo ou pornografia). Caio afirmou não ter conhecimento de que o fato por ele praticado seria criminoso.", comando:"A tese defensiva correta, a partir da afirmação de Caio, é a ocorrência do erro", gabarito:"C", alt:{"A": "Sobre a pessoa.", "B": "De tipo permissivo.", "C": "De proibição direto.", "D": "De proibição indireto."}, fb:{"A": "Incorreta. Erro sobre a pessoa (art. 20, §3º, CP) ocorre quando o agente confunde a identidade da vítima. Sem relação com o caso.", "B": "Incorreta. Erro de tipo permissivo ocorre quando o agente imagina existir situação de fato que justificaria sua conduta — ex: imagina estar em legítima defesa. Sem relação com o caso.", "C": "Correta! Art. 21, CP: erro de proibição direto — o agente conhece os fatos (sabia que estava compartilhando imagens), mas desconhecia que a conduta era proibida. Caio sabia o que estava fazendo, mas alegou ignorar a ilicitude. É o erro de proibição direto: atinge a consciência da ilicitude, não o conhecimento dos fatos.", "D": "Incorreta. Erro de proibição indireto ocorre quando o agente conhece a proibição mas acredita que existe uma causa de justificação autorizando sua conduta. Caio não alegou isso."}, fund:"Art. 21, CP: o erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de 1/6 a 1/3. Art. 218-C, CP (incluído pela Lei 13.718/2018): divulgar, sem consentimento da vítima, cena de sexo, nudez ou pornografia.", caqui:"Quatro tipos de erro em penal: ERRO DE TIPO (art. 20): agente não sabe o que está fazendo. ERRO SOBRE PESSOA (art. 20, §3º): confunde a vítima. ERRO DE TIPO PERMISSIVO (art. 20, §1º): imagina situação de fato que justificaria a conduta. ERRO DE PROIBIÇÃO DIRETO (art. 21): sabe o que faz, mas não sabe que é proibido — 'não sabia que era crime'. ERRO DE PROIBIÇÃO INDIRETO: sabe que é proibido mas crê em causa de justificação. Caio = erro de proibição direto."},
  {num:3, exame:"42º Exame — 2024", titulo:"Importunação Sexual — Ação Penal Pública Incondicionada", enunciado:"Ana Paula é repórter esportiva de uma emissora de televisão. Ao participar de uma reportagem ao vivo na mídia televisiva, um torcedor presente ao estádio, com intenção de satisfazer sua própria lascívia, a abraça à força, beijando-a no rosto. Ana Paula sente-se afrontada em sua liberdade sexual. Em razão do fato, ela procura você, como advogado, para saber como proceder.", comando:"Assinale a afirmativa que apresenta corretamente sua orientação.", gabarito:"A", alt:{"A": "O fato constitui importunação sexual e se processa mediante ação penal pública incondicionada.", "B": "O ato deve ser identificado como delito de injúria real e se processa mediante ação penal privada.", "C": "O episódio equivale a estupro e se processa mediante ação penal pública condicionada à representação da ofendida.", "D": "O caso tipifica posse sexual mediante fraude e se processa mediante queixa."}, fb:{"A": "Correta! O torcedor praticou ato libidinoso (abraço forçado com beijo) sem consentimento de Ana Paula, visando satisfazer sua lascívia = importunação sexual (art. 215-A, CP). E a ação penal, após a Lei 13.718/2018, para TODOS os crimes contra a dignidade sexual é pública incondicionada (art. 225, CP). Ana Paula não precisa representar — o MP age de ofício.", "B": "Incorreta. Não se trata de injúria real. O bem jurídico atingido é a liberdade sexual, não a honra.", "C": "Incorreta. Não houve violência ou grave ameaça que caracterize estupro. E todos os crimes contra a dignidade sexual são de ação penal pública INCONDICIONADA — não condicionada.", "D": "Incorreta. Violação sexual mediante fraude exige fraude como meio para obter consentimento viciado. Aqui não houve fraude."}, fund:"Art. 215-A, CP: importunação sexual. Art. 225, CP (Lei 13.718/2018): nos crimes definidos nos Capítulos I e II deste Título, procede-se mediante ação penal pública incondicionada. Antes da Lei 13.718/2018, alguns crimes dependiam de representação. Após a lei, TODOS são incondicionados.", caqui:"Dois pontos em um: (1) beijo forçado + sem violência = importunação sexual. (2) Ação penal: a Lei 13.718/2018 unificou tudo — TODOS os crimes contra a dignidade sexual são de ação penal pública incondicionada. Ana Paula não precisa de nada para que o MP aja. Acabou a representação, acabou a queixa para esses crimes."},
  {num:4, exame:"XXXVII Exame — 2023", titulo:"Estupro de Vulnerável — Vulnerabilidade Absoluta", enunciado:"Antônio, de 49 anos, manteve numerosas relações sexuais consensuais com Miriam, à época com 13 anos, que tinha experiência sexual anterior, durante o namoro entre eles. Antônio tinha conhecimento da idade de Miriam.", comando:"Sobre o caso, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Antônio cometeu conduta típica, ilícita e culpável.", "B": "Antônio cometeu conduta ilícita e culpável, mas não típica.", "C": "Antônio cometeu conduta típica e culpável, mas não ilícita.", "D": "Antônio cometeu conduta típica e ilícita, mas não culpável."}, fb:{"A": "Correta! Art. 217-A, CP: ter conjunção carnal ou praticar outro ato libidinoso com menor de 14 anos. Miriam tem 13 anos = menor de 14 = vulnerável por critério etário. Art. 217-A, §5º (Lei 13.718/2018): as penas se aplicam independentemente do consentimento da vítima ou do fato de ela ter mantido relações sexuais anteriormente ao crime. Conduta típica, ilícita e culpável.", "B": "Incorreta. A conduta é típica — Antônio praticou exatamente o descrito no art. 217-A.", "C": "Incorreta. Não há causa de excludente de ilicitude. O consentimento e a experiência sexual anterior são expressamente irrelevantes pelo §5º do art. 217-A.", "D": "Incorreta. Antônio tem plena capacidade de culpabilidade. Sabia da idade de Miriam."}, fund:"Art. 217-A, CP: estupro de vulnerável. §5º (Lei 13.718/2018): as penas se aplicam independentemente do consentimento da vítima ou do fato de ela ter mantido relações sexuais anteriormente ao crime. A vulnerabilidade do menor de 14 anos é OBJETIVA e ABSOLUTA.", caqui:"A vulnerabilidade de menor de 14 anos é absoluta — não importa: consentimento, experiência sexual anterior, namoro, aparência de maior. A lei é peremptória. O §5º foi incluído exatamente para acabar com essas teses defensivas. STF já consolidou: menor de 14 anos = vulnerável absoluta = estupro de vulnerável, ponto."},
  {num:5, exame:"XXXVI Exame — 2022", titulo:"Assédio Sexual — Crime Formal", enunciado:"Robson, diretor-presidente da Sociedade Empresária RX Empreendimentos, telefona para sua secretária Camila e solicita que ela compareça à sua sala. Durante a conversa, Robson afirma que estaria interessado nela e a convida para ir a um motel. Camila recusa o convite e, ato contínuo, Robson afirma que se ela não aceitar, nem precisa retornar ao trabalho no dia seguinte, pois estaria demitida. Camila, desesperada, sai da sala de seu chefe e vai até a Delegacia Policial para registrar o fato.", comando:"Diante das informações apresentadas, é correto afirmar que a conduta praticada por Robson se amolda ao crime de:", gabarito:"B", alt:{"A": "Tentativa de assédio sexual (Art. 216-A), não chegando o crime a ser consumado na medida em que se trata de crime material, exigindo a produção do resultado, o que não ocorreu na hipótese.", "B": "Assédio sexual consumado, uma vez que o delito é formal, ocorrendo a sua consumação independentemente da obtenção da vantagem sexual pretendida.", "C": "Fato atípico, uma vez que a conduta praticada por Robson configura mero ato preparatório do crime de assédio sexual, sendo certo que os atos preparatórios não são puníveis.", "D": "Importunação sexual (Art. 215-A), uma vez que Robson praticou, contra a vontade de Camila, ato visando à satisfação de sua lascívia."}, fb:{"A": "Incorreta. O assédio sexual NÃO é crime material — é crime FORMAL. A consumação não exige a obtenção da vantagem sexual; basta o constrangimento com o intuito de obtê-la.", "B": "Correta! Art. 216-A, CP: constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se da condição de superior hierárquico. Crime FORMAL: consuma-se com o constrangimento, independentemente da aceitação da proposta. Robson é diretor-presidente (superior hierárquico), Camila é secretária (subordinada), e a ameaça de demissão configura o constrangimento. Crime consumado.", "C": "Incorreta. Não foram meros atos preparatórios — houve constrangimento real com ameaça concreta de demissão.", "D": "Incorreta. Importunação sexual exige ato libidinoso praticado diretamente. O assédio sexual se caracteriza pelo constrangimento verbal/moral mediante abuso hierárquico."}, fund:"Art. 216-A, CP: constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se o agente da sua condição de superior hierárquico ou ascendência inerentes ao exercício de emprego, cargo ou função. Pena: detenção de 1 a 2 anos. Crime formal.", caqui:"Assédio sexual = crime FORMAL. Não precisa obter a vantagem sexual para consumar. Basta CONSTRANGER usando a posição hierárquica superior. Robson ameaçou Camila de demissão se não aceitasse o convite sexual = constrangimento + hierarquia + finalidade sexual = assédio sexual consumado no momento da ameaça. Camila não precisou aceitar nada para o crime estar consumado."},
  {num:6, exame:"XXXV Exame — 2022", titulo:"Estupro de Vulnerável — Revogação do Livramento Condicional", enunciado:"No dia 31/12/2020, Fausto, com 39 anos, enquanto conversava com Ana Vitória, de 12 anos de idade, sem violência ou grave ameaça à pessoa, passava as mãos nos seios e nádegas da adolescente, conduta flagrada pela mãe da menor. Preocupada, em especial porque sabe que Fausto cumpre pena em livramento condicional por condenação com trânsito em julgado pelo crime de latrocínio, a família de Ana Vitória procura você, como advogado, para esclarecimento sobre a conduta praticada.", comando:"Por ocasião da consulta jurídica, deverá ser esclarecido que o crime em tese praticado por Fausto é o de", gabarito:"A", alt:{"A": "estupro de vulnerável (Art. 217-A do CP), não fazendo jus Fausto, em caso de eventual condenação, a novo livramento condicional.", "B": "importunação sexual (Art. 215-A do CP), não fazendo jus Fausto, em caso de eventual condenação, a novo livramento condicional.", "C": "estupro de vulnerável (Art. 217-A do CP), podendo Fausto, em caso de condenação, após cumprimento de determinado tempo de pena e observados os requisitos subjetivos, obter novo livramento condicional.", "D": "importunação sexual (Art. 215-A do CP), podendo Fausto, em caso de condenação, após cumprimento de determinado tempo de pena e observados os requisitos subjetivos, obter novo livramento condicional."}, fb:{"A": "Correta! CRIME: Fausto praticou ato libidinoso (passar as mãos nos seios e nádegas) com Ana Vitória de 12 anos — menor de 14 anos = estupro de vulnerável (art. 217-A), independentemente da ausência de violência ou grave ameaça. LIVRAMENTO CONDICIONAL: Fausto está em livramento condicional por latrocínio. O latrocínio é crime hediondo e o estupro de vulnerável também é hediondo. Sendo reincidente específico em crime hediondo, Fausto fica vedado de obter novo livramento condicional pela via do art. 83, V, CP. Além disso, a prática de novo crime doloso durante o livramento acarreta sua revogação obrigatória (art. 86, I, CP). Na perspectiva da questão, Fausto não terá direito a novo livramento nas circunstâncias apresentadas.", "B": "Incorreta. A conduta é estupro de vulnerável (art. 217-A), não importunação sexual. Ato libidinoso com menor de 14 anos é sempre estupro de vulnerável.", "C": "Incorreta. Identifica corretamente o crime mas erra no livramento — o réu será reincidente específico em crime hediondo (latrocínio + estupro de vulnerável), o que veda a via do art. 83, V, CP, e o livramento anterior será revogado pela prática de novo crime doloso.", "D": "Incorreta. Erra tanto no crime (não é importunação sexual) quanto no livramento condicional."}, fund:"Art. 217-A, CP: estupro de vulnerável — qualquer ato libidinoso com menor de 14 anos, com ou sem violência. Art. 86, I, CP: o livramento condicional será revogado se o liberado vier a ser condenado a pena privativa de liberdade por crime doloso. Art. 83, V, CP (incluído pela Lei 13.344/2016): livramento condicional em crime hediondo exige o cumprimento de mais de 2/3 da pena — e essa via fica vedada ao reincidente específico em crimes dessa natureza, como é o caso de Fausto.", caqui:"Questão dupla — crime e livramento. CRIME: ato libidinoso + menor de 12 anos = estupro de vulnerável (não importunação). O art. 217-A abrange qualquer ato libidinoso com menor de 14 anos, mesmo sem violência. LIVRAMENTO: Fausto está em livramento por latrocínio (hediondo). Cometeu estupro de vulnerável (hediondo) durante o livramento. Resultado: (1) livramento anterior é revogado pelo novo crime doloso (art. 86, I); (2) como reincidente específico em crime hediondo, fica vedado de obter novo livramento pela via do art. 83, V. Na prática: não tem direito a novo livramento nessas circunstâncias."},
  {num:7, exame:"XVIII Exame — 2015", titulo:"Estupro — Distinção com Violação Sexual Mediante Fraude", enunciado:"Glória é contratada como secretária de Felipe, um grande executivo de uma sociedade empresarial. Felipe simula a existência de uma reunião de negócios e pede para que a secretária fique no local para auxiliá-lo. À noite, Glória comparece à sala do executivo acreditando que ocorreria a reunião, quando é surpreendida por este, que coloca uma faca em seu pescoço e exige a prática de atos sexuais, sendo, em razão do medo, atendido. Após o ato, Felipe afirmou que Glória deveria comparecer normalmente ao trabalho no dia seguinte e ainda lhe entregou duas notas de R$ 100,00.", comando:"Diante da situação narrada, é correto afirmar que Felipe deverá responder pela prática do crime de:", gabarito:"D", alt:{"A": "Violação sexual mediante fraude.", "B": "Assédio sexual.", "C": "Favorecimento da prostituição ou outra forma de exploração sexual.", "D": "Estupro."}, fb:{"A": "Incorreta. A fraude foi usada apenas para atrair a vítima ao local (ato preparatório). A relação sexual em si foi obtida mediante grave ameaça (faca no pescoço). Quando há grave ameaça, o crime é o mais grave: estupro.", "B": "Incorreta. O assédio sexual exige relação hierárquica/funcional e constrangimento sem violência física. Aqui houve grave ameaça com arma.", "C": "Incorreta. Não houve favorecimento à prostituição. As notas de R$100 entregues após o ato são irrelevantes para a tipificação — não transformam o estupro em prostituição.", "D": "Correta! Art. 213, CP: constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou praticar ou permitir que com ele se pratique outro ato libidinoso. Felipe colocou uma faca no pescoço de Glória (grave ameaça) e exigiu atos sexuais. A fraude foi usada apenas como preparação para atrair a vítima ao local — o crime foi consumado com grave ameaça."}, fund:"Art. 213, CP: estupro — constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou praticar ou permitir que com ele se pratique outro ato libidinoso. Pena: reclusão de 6 a 10 anos. Fraude como ato preparatório não caracteriza violação sexual mediante fraude quando a obtenção do ato sexual se dá por violência ou grave ameaça.", caqui:"A pegadinha: a fraude existiu, mas foi só para atrair a vítima ao local. A relação sexual foi obtida com FACA NO PESCOÇO = grave ameaça = estupro. Quando há violência ou grave ameaça na obtenção do ato sexual, o crime é sempre estupro — independentemente de qualquer fraude anterior. As notas de R$100 são completamente irrelevantes — não existe 'estupro remunerado' como excludente."},
  {num:8, exame:"XIII Exame — 2014", titulo:"Estupro Qualificado pelo Resultado Morte — Nexo Causal", enunciado:"Analise os fragmentos: I. João constrange Maria, por meios violentos, a ter com ele relação sexual. Em virtude da violência empregada para a consumação do ato, Maria sofre lesões corporais de natureza grave que a levam a óbito. II. Joaquim constrange Benedita, por meio de grave ameaça, a ter com ele relação sexual. Após o coito, Benedita falece em decorrência de ataque cardíaco, pois padecia, desde criança, de cardiopatia grave, condição desconhecida por Joaquim.", comando:"A partir das situações apresentadas nos fragmentos I e II, os delitos cometidos são, respectivamente:", gabarito:"D", alt:{"A": "Estupro qualificado pelo resultado morte e estupro qualificado pelo resultado morte.", "B": "Estupro em concurso com lesão corporal seguida de morte e estupro simples.", "C": "Estupro qualificado pelo resultado morte e estupro em concurso com homicídio preterdoloso.", "D": "Estupro qualificado pelo resultado morte e estupro simples."}, fb:{"A": "Incorreta. No fragmento II, não há nexo causal entre a conduta de Joaquim e a morte de Benedita — a morte decorreu de condição pessoal preexistente desconhecida pelo agente. Não configura qualificadora.", "B": "Incorreta. No fragmento I, não há concurso de crimes — o estupro com resultado morte é crime único qualificado. E no fragmento II, não é homicídio preterdoloso.", "C": "Incorreta. No fragmento II não há homicídio preterdoloso — a morte decorreu de causa preexistente desconhecida, sem nexo causal com a conduta.", "D": "Correta! Fragmento I: João empregou violência → violência causou lesões graves → lesões causaram a morte. Nexo causal presente = estupro qualificado pelo resultado morte (art. 213, §2º, CP). Fragmento II: Joaquim usou grave ameaça (sem violência física), Benedita morreu de cardiopatia preexistente desconhecida, sem nexo causal com a conduta = estupro simples."}, fund:"Art. 213, §1º, CP: se da conduta resulta lesão corporal de natureza grave — reclusão de 8 a 12 anos. Art. 213, §2º: se da conduta resulta morte — reclusão de 12 a 30 anos. A qualificadora pelo resultado exige nexo causal entre a conduta e o resultado. Sem nexo causal imputável ao agente, não incide a qualificadora.", caqui:"Chave do estupro qualificado pelo resultado: NEXO CAUSAL. Caso I: violência → lesões graves → morte. Há nexo. Crime qualificado pelo §2º (resultado morte). Caso II: grave ameaça (sem violência física) → coito → cardiopatia desconhecida → morte. SEM nexo causal com a conduta de Joaquim. Resultado: estupro simples. Se Joaquim soubesse da cardiopatia e tivesse criado o risco, seria diferente — mas não sabia."},
  {num:9, exame:"XII Exame — 2013", titulo:"Erro de Tipo Essencial — Estupro de Vulnerável", enunciado:"Bráulio, rapaz de 18 anos, conhece Paula em um show de rock, em uma casa noturna. Os dois, após conversarem um pouco, resolvem dirigir-se a um motel e ali, de forma consentida, o jovem mantém relações sexuais com Paula. Após, Bráulio descobre que a moça, na verdade, tinha apenas 13 anos e que somente conseguira entrar no show mediante apresentação de carteira de identidade falsa.", comando:"A partir da situação narrada, assinale a afirmativa correta.", gabarito:"C", alt:{"A": "Bráulio deve responder por estupro de vulnerável doloso.", "B": "Bráulio deve responder por estupro de vulnerável culposo.", "C": "Bráulio não praticou crime, pois agiu em hipótese de erro de tipo essencial.", "D": "Bráulio não praticou crime, pois agiu em hipótese de erro de proibição direto."}, fb:{"A": "Incorreta. Para responder por estupro de vulnerável doloso, Bráulio precisaria ter consciência (dolo) de que Paula era menor de 14 anos. Ele não sabia — ela usou documento falso.", "B": "Incorreta. Não existe estupro de vulnerável culposo no Código Penal. Os crimes sexuais só são puníveis na forma dolosa. Sem forma culposa prevista em lei = sem punição.", "C": "Correta! Art. 20, CP: erro de tipo essencial — o erro sobre elemento constitutivo do tipo penal exclui o dolo. O elemento 'menor de 14 anos' é constitutivo do tipo do art. 217-A. Bráulio não sabia que Paula tinha 13 anos (ela usou documento falso em casa noturna). Erro inevitável (qualquer pessoa naquelas circunstâncias também erraria). Sem dolo + sem forma culposa prevista = atipicidade = absolvição.", "D": "Incorreta. Erro de proibição seria 'sabia que Paula tinha 13 anos, mas não sabia que era crime'. Aqui o erro é sobre um FATO (a idade da vítima), não sobre a proibição da conduta."}, fund:"Art. 20, CP: o erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei. Art. 217-A, CP: elemento constitutivo — ser a vítima menor de 14 anos. Bráulio desconhecia esse elemento. Sem forma culposa no estupro de vulnerável = absolvição.", caqui:"Questão clássica do erro de tipo no estupro de vulnerável. A elemento 'menor de 14 anos' é objetivo e constitutivo do tipo. Se o agente não sabia = erro de tipo essencial (art. 20 CP). Como não existe estupro de vulnerável culposo, o erro elimina a única forma punível (dolosa) → absolvição. A FGV adorou essa questão. Só não funciona quando o agente tinha como saber — aqui ele não tinha, pois ela entrou com documento falso em casa noturna frequentada por adultos."},
  {num:10, exame:"X Exame — 2013", titulo:"Violação Sexual Mediante Fraude — Vítima com 14 Anos", enunciado:"José, rapaz de 23 anos, acredita ter poderes espirituais excepcionais. Ocorre que José está apaixonado por Maria, jovem de 14 anos, mas não é correspondido. Objetivando manter relações sexuais com Maria e conhecendo o misticismo de sua vítima, José a faz acreditar que ela sofre de um mal espiritual, o qual só pode ser sanado por meio de um ritual mágico de cura e purificação, que consiste em manter relações sexuais com alguém espiritualmente capacitado. Maria, muito assustada com a notícia, aceita e mantém, de forma consentida, relação sexual com José.", comando:"Com base na situação descrita, assinale a alternativa que indica o crime que José praticou.", gabarito:"B", alt:{"A": "Corrupção de menores (Art. 218, do CP).", "B": "Violação sexual mediante fraude (Art. 215, do CP).", "C": "Estupro qualificado (Art. 213, § 1º, parte final, do CP).", "D": "Estupro de vulnerável (Art. 217-A, do CP)."}, fb:{"A": "Incorreta. Corrupção de menores (art. 218, CP) refere-se a induzir menor de 14 anos a satisfazer a lascívia de OUTREM. Aqui José praticou o ato diretamente com Maria.", "B": "Correta! Maria tem 14 anos completos — NÃO é menor DE 14 anos, portanto NÃO é vulnerável pelo critério etário do art. 217-A (que exige MENOR DE 14 anos). José obteve o consentimento de Maria por meio de fraude (ritual espiritual falso). Isso configura exatamente o art. 215, CP: violação sexual mediante fraude — ter conjunção carnal com alguém, mediante fraude ou outro meio que impeça a livre manifestação de vontade da vítima.", "C": "Incorreta. Não houve violência ou grave ameaça que caracterize estupro.", "D": "Incorreta. Art. 217-A exige MENOR DE 14 anos. Maria tem 14 anos completos — está fora do âmbito de proteção do art. 217-A pelo critério etário."}, fund:"Art. 215, CP: ter conjunção carnal ou praticar outro ato libidinoso com alguém, mediante fraude ou outro meio que impeça ou dificulte a livre manifestação de vontade da vítima. Pena: reclusão de 2 a 6 anos. Art. 217-A: exige MENOR DE 14 anos. Vítima com 14 anos completos = não está no tipo.", caqui:"A armadilha: Maria tem 14 anos completos. O art. 217-A protege o MENOR DE 14 anos — quem já completou 14 anos não se enquadra. Com 14 anos completos, José não pode responder por estupro de vulnerável. Como usou fraude (ritual falso) para obter o consentimento de alguém com 14 anos = violação sexual mediante fraude (art. 215). Um único dia de diferença pode mudar completamente o tipo penal. Atenção ao 'menor de 14' — é 13 anos e 364 dias, não 14 anos completos."},
  {num:11, exame:"Exame de Ordem — 2006 (CESPE)", titulo:"Dolo — Elementos Cognitivo e Volitivo", enunciado:"Assinale a opção correta, de acordo com o ordenamento penal brasileiro.", comando:"Assinale a opção correta, de acordo com o ordenamento penal brasileiro.", gabarito:"B", alt:{"A": "No peculato, a restituição do valor desviado importa, por si só, o afastamento do animus rem sibi habendi porque, para a caracterização desse tipo penal, é necessária a efetiva obtenção da vantagem ilícita.", "B": "A doutrina penal brasileira instrui que o dolo, ainda que eventual, conquanto constitua elemento subjetivo do tipo, deve ser compreendido sob dois aspectos: o cognitivo, que traduz o conhecimento dos elementos objetivos do tipo, e o volitivo, configurado pela vontade de realizar a conduta típica.", "C": "A consumação do crime de estelionato se dá independentemente da efetiva obtenção de vantagem ilícita, em detrimento de outrem, mediante sua indução ou manutenção em erro, utilização de artifício, ardil ou fraude.", "D": "O crime de estupro, se perpetrado em sua forma simples ou com violência presumida, não é considerado crime hediondo."}, fb:{"A": "Incorreta. No peculato (art. 312, CP), a restituição posterior não afasta o crime já consumado. O animus rem sibi habendi é elemento subjetivo, mas a restituição é apenas circunstância posterior.", "B": "Correta! O dolo possui dois elementos: COGNITIVO (intelectivo) = conhecimento dos elementos objetivos do tipo — o agente sabe o que está fazendo. VOLITIVO = vontade de realizar a conduta típica. No dolo eventual, o elemento volitivo se manifesta como assunção do risco. É a teoria finalista do dolo, dominante na doutrina penal brasileira.", "C": "Incorreta. O estelionato (art. 171, CP) exige a efetiva obtenção de vantagem ilícita para se consumar — é crime material. Sem a vantagem = tentativa de estelionato.", "D": "Incorreta. O estupro é crime hediondo (art. 1º, V, Lei 8.072/90), tanto em forma simples quanto nas formas qualificadas. Não existe a ressalva mencionada."}, fund:"Art. 18, I, CP: dolo direto e dolo eventual. Teoria finalista do dolo: dolo = consciência (elemento cognitivo) + vontade (elemento volitivo). Lei 8.072/90, art. 1º, V: estupro simples e qualificado são crimes hediondos.", caqui:"Dolo = dois elementos: (1) COGNITIVO: saber o que está fazendo — conhecer os elementos do tipo. (2) VOLITIVO: querer fazer — ter a vontade de realizar a conduta. No dolo eventual: sabe que pode causar o resultado e assume o risco — o elemento volitivo não é 'querer' o resultado, mas 'aceitar' o risco de produzi-lo. Questão do CESPE 2006 incluída por cobrar conceito doutrinário clássico que fundamenta toda a teoria dos crimes sexuais."},
  {num:12, exame:"XLI Exame — 2024", titulo:"Estupro de Vulnerável — Termo Inicial da Prescrição", enunciado:"Enzo completou neste mês 18 anos de idade, sendo certo que, na sua infância, foi vítima de estupro de vulnerável. Considerando que já se passaram 11 anos desde a data do fato, ocorrido em 2013, sem que tenha sido instaurado qualquer inquérito ou investigação, e que o autor do fato já completou 70 anos de idade, Enzo indagou a você, como advogado(a), se ainda seria possível iniciar a persecução penal.", comando:"Nesse caso, como advogado(a) de Enzo, assinale a alternativa que, corretamente, orienta a vítima.", gabarito:"C", alt:{"A": "O crime de estupro de vulnerável é imprescritível.", "B": "O delito está prescrito, ante a redução do prazo prescricional em função da idade do autor do fato.", "C": "O prazo de prescrição do delito começou a correr quando Enzo completou 18 anos, não se tendo ultimado até o momento.", "D": "O prazo de prescrição aplicável ao caso é de 20 anos, contado da data do fato, não tendo ocorrido a prescrição."}, fb:{"A": "Incorreta. A Constituição Federal reserva a imprescritibilidade apenas para racismo e ação de grupos armados contra a ordem constitucional (art. 5º, XLII e XLIV, CF). O estupro de vulnerável é gravíssimo, mas não é imprescritível.", "B": "Incorreta. A idade do autor (70 anos) de fato reduz o prazo prescricional pela metade na data da sentença (art. 115, CP) — mas isso não significa que o prazo já esteja esgotado. E o erro maior é o termo inicial: não é a data do fato, é a data em que a vítima completa 18 anos.", "C": "Correta! Art. 111, V, CP: nos crimes contra a dignidade sexual ou que envolvam violência contra criança e adolescente, a prescrição só começa a correr da data em que a vítima completa 18 anos — salvo se antes disso já havia sido proposta a ação penal. Enzo completou 18 anos agora, então o prazo prescricional está apenas começando a correr, não estando de forma alguma esgotado.", "D": "Incorreta. O erro está no termo inicial: o prazo não conta da data do fato (2013), mas da data em que Enzo completou 18 anos — que é agora."}, fund:"Art. 111, V, CP: nos crimes contra a dignidade sexual ou que envolvam violência contra a criança e o adolescente, a prescrição começa a correr da data em que a vítima completa 18 anos, salvo se a essa altura já houver sido proposta a ação penal. Art. 115, CP: o prazo prescricional é reduzido pela metade quando o agente é maior de 70 anos na data da sentença. O crime de estupro de vulnerável (art. 217-A) tem pena de reclusão de 10 a 18 anos desde a Lei 15.280/2025 (era de 8 a 15 anos à época do exame).", caqui:"A pegadinha central é o TERMO INICIAL da prescrição. Em crimes comuns, o prazo conta da data do fato. Mas em crimes sexuais contra crianças e adolescentes, o legislador entendeu que a própria vítima, enquanto menor, muitas vezes não tem condições de denunciar o agressor — então a lei 'pausa' o relógio até ela completar 18 anos. Só a partir daí o prazo começa a rodar de verdade. Enzo acabou de fazer 18 anos: o prazo está nascendo agora, não morrendo. A idade do autor (70 anos) é uma pegadinha secundária — reduz o prazo pela metade na sentença, mas não apaga o fato de que o prazo mal começou."},
  {num:13, exame:"XXV Exame — 2018", titulo:"Estupro — Tipo Penal Misto Alternativo", enunciado:"Em um mesmo contexto fático, contra a mesma vítima, o agente pratica conjunção carnal e, na sequência, outro ato libidinoso diverso (sexo oral), mediante grave ameaça.", comando:"De acordo com o entendimento consolidado dos tribunais superiores sobre o crime de estupro (art. 213, CP), é correto afirmar que o agente praticou:", gabarito:"B", alt:{"A": "Dois crimes de estupro, em concurso material, um para a conjunção carnal e outro para o ato libidinoso diverso.", "B": "Um único crime de estupro, pois o tipo penal do art. 213 é misto alternativo, abrangendo tanto a conjunção carnal quanto outros atos libidinosos praticados no mesmo contexto.", "C": "Crime de estupro em concurso formal com crime de importunação sexual.", "D": "Continuidade delitiva entre dois crimes de estupro."}, fb:{"A": "Incorreta. Não há concurso material. O art. 213 unificou as condutas em um único tipo penal misto alternativo — praticar mais de uma das condutas nele descritas no mesmo contexto fático não gera dois crimes.", "B": "Correta! Desde a Lei 12.015/2009, o art. 213 do CP passou a ser um tipo penal misto alternativo, que reúne em uma única figura a conjunção carnal e outros atos libidinosos. Praticando o agente conjunção carnal e outro ato libidinoso, no mesmo contexto fático e contra a mesma vítima, há crime único de estupro — a pluralidade de condutas é irrelevante para a caracterização de mais de um crime, podendo, no máximo, influenciar a dosimetria da pena-base.", "C": "Incorreta. A importunação sexual (art. 215-A) é subsidiária ao estupro — só se aplica quando o ato não constitui crime mais grave. Havendo grave ameaça, o crime é estupro, não importunação sexual.", "D": "Incorreta. Não há continuidade delitiva (que pressupõe crimes da mesma espécie em condições de tempo, lugar e modo de execução distintas) — há um único crime, praticado em um só contexto fático."}, fund:"Art. 213, CP (redação da Lei 12.015/2009): tipo penal misto alternativo, que unificou as antigas figuras de estupro e atentado violento ao pudor. STJ, REsp 1230525/DF: a prática de conjunção carnal e de outros atos libidinosos, no mesmo contexto fático e contra a mesma vítima, configura crime único de estupro, não concurso de crimes nem continuidade delitiva.", caqui:"Antes de 2009, existiam dois crimes separados: estupro (só conjunção carnal) e atentado violento ao pudor (outros atos libidinosos). A Lei 12.015/2009 juntou os dois num tipo só — o art. 213 virou uma 'caixa' que aceita qualquer uma dessas condutas, e praticar mais de uma delas no mesmo contexto não multiplica o crime. É como um cardápio com duas opções de prato principal: você pode pedir as duas, mas ainda é um pedido só. A pluralidade de atos pode pesar na pena-base (art. 59), mas não cria um segundo crime."},
  {num:14, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Registro Não Autorizado da Intimidade Sexual — Montagem Digital", enunciado:"Ricardo, usando um aplicativo de inteligência artificial, cria uma montagem digital sobreposição do rosto de Bianca, sua ex-namorada, em fotografias de nudez de outra pessoa, sem que Bianca tenha participado da cena original ou autorizado a montagem. Ricardo apenas salva as imagens em seu computador, sem divulgá-las a ninguém.", comando:"Considerando o Código Penal, assinale a afirmativa correta sobre a conduta de Ricardo.", gabarito:"C", alt:{"A": "A conduta é atípica, pois não houve divulgação das imagens a terceiros.", "B": "Ricardo praticou o crime de divulgação de cena de sexo, nudez ou pornografia (art. 218-C, CP).", "C": "Ricardo praticou o crime de registro não autorizado da intimidade sexual (art. 216-B, parágrafo único, CP), que pune expressamente a montagem com o fim de incluir pessoa em cena de nudez ou ato sexual.", "D": "A conduta é atípica, pois Bianca não participou fisicamente da cena de nudez retratada."}, fb:{"A": "Incorreta. O crime do art. 216-B se consuma com a própria produção do registro ou da montagem — não exige divulgação a terceiros. A divulgação, se ocorrer, configura crime autônomo (art. 218-C).", "B": "Incorreta. O art. 218-C pune quem divulga a cena a terceiros. Como Ricardo apenas produziu e guardou a montagem, sem divulgá-la, o crime cometido é o do art. 216-B, não o do art. 218-C.", "C": "Correta! Art. 216-B, parágrafo único, CP: incorre na mesma pena do caput quem realiza montagem em fotografia, vídeo, áudio ou qualquer outro registro, com o fim de incluir pessoa em cena de nudez ou ato sexual ou libidinoso de caráter íntimo. A lei pune expressamente a montagem digital, ainda que a vítima nunca tenha participado fisicamente da cena original — é justamente o caso de Ricardo.", "D": "Incorreta. É exatamente essa a hipótese do parágrafo único do art. 216-B — a punição existe justamente porque a vítima não participou da cena original; a montagem cria uma falsa impressão de participação."}, fund:"Art. 216-B, caput, CP: produzir, fotografar, filmar ou registrar conteúdo com cena de nudez ou ato sexual de caráter íntimo e privado, sem autorização dos participantes. Parágrafo único: incorre na mesma pena quem realiza montagem com o fim de incluir pessoa em cena de nudez ou ato sexual. Pena: detenção de 6 meses a 1 ano, e multa.", caqui:"Duas armadilhas comuns aqui: a primeira é achar que 'sem divulgar, não tem crime' — errado, o simples ato de produzir ou montar já consuma o crime do art. 216-B, mesmo guardado só para o próprio agente. A segunda é achar que precisa ter havido participação real da vítima na cena — também errado: o parágrafo único foi criado justamente para as montagens (hoje muito comuns com IA), em que o rosto da vítima é encaixado numa cena que ela nunca viveu. Se Ricardo tivesse divulgado a montagem, aí sim entraria também o art. 218-C, em concurso."},
  {num:15, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Favorecimento da Prostituição de Vulnerável — Irrelevância da Iniciativa da Vítima", enunciado:"Marcelo, proprietário de uma boate, passa a induzir Letícia, de 16 anos, a se prostituir em seu estabelecimento, ainda que Letícia afirme estar fazendo isso por vontade própria e sem qualquer coação.", comando:"Considerando o Código Penal, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Marcelo pratica o crime de favorecimento da prostituição ou outra forma de exploração sexual de vulnerável (art. 218-B, CP), sendo irrelevante que Letícia afirme agir por iniciativa própria.", "B": "A conduta é atípica, pois Letícia é maior de 14 anos e afirma agir por vontade própria, o que afasta a tipicidade.", "C": "Marcelo pratica o crime de tráfico de pessoas para fim de exploração sexual, exclusivamente.", "D": "A conduta somente será típica se ficar demonstrado que Marcelo obteve lucro direto com a prostituição de Letícia."}, fb:{"A": "Correta! Art. 218-B, CP: submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual alguém menor de 18 anos. A doutrina e a jurisprudência são pacíficas: é irrelevante que o menor afirme se prostituir por iniciativa própria — a lei protege o desenvolvimento sexual do menor de 18 anos independentemente de seu consentimento ou de sua vontade manifestada.", "B": "Incorreta. O art. 218-B protege qualquer pessoa menor de 18 anos, não apenas o menor de 14. Letícia, com 16 anos, está no âmbito de proteção da norma. Seu consentimento ou iniciativa própria não afasta a tipicidade.", "C": "Incorreta. O caso não menciona os elementos do tráfico de pessoas (deslocamento, aliciamento transfronteiriço etc.) — a conduta descrita se amolda diretamente ao art. 218-B.", "D": "Incorreta. O tipo não exige lucro direto do agente — basta submeter, induzir, atrair, facilitar ou impedir/dificultar o abandono da prática pelo menor."}, fund:"Art. 218-B, CP: submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual pessoa menor de 18 anos, ou que, por enfermidade ou deficiência mental, não tem discernimento; facilitá-la; impedir ou dificultar que a abandone. Pena elevada pela Lei 15.280/2025 para reclusão de 7 a 16 anos, e multa. É irrelevante o consentimento ou a iniciativa do menor.", caqui:"Regra de ouro nos crimes contra vulnerável: o consentimento do menor NUNCA legitima a conduta do adulto. Isso vale para o estupro de vulnerável (art. 217-A, §5º) e vale igualmente aqui. Letícia dizer que 'quer' se prostituir não muda nada — ela tem 16 anos, e a lei simplesmente não reconhece esse consentimento como válido nessa esfera. Marcelo não precisa nem lucrar diretamente: basta induzir, facilitar, ou dificultar que ela pare."},
  {num:16, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Estupro Coletivo — Causa de Aumento do Art. 226, IV, 'a'", enunciado:"Rodrigo e Tiago, em conjunto, constrangem Camila, mediante grave ameaça, à prática de conjunção carnal. Apenas Rodrigo efetivamente pratica o ato sexual; Tiago permanece no local, segurando a vítima e impedindo sua fuga, ciente do que estava ocorrendo.", comando:"Considerando o Código Penal, assinale a afirmativa correta quanto à responsabilização de Tiago.", gabarito:"B", alt:{"A": "Tiago não responde pelo crime de estupro, pois não praticou pessoalmente o ato sexual.", "B": "Tiago responde pelo crime de estupro, na condição de coautor, com incidência da causa de aumento do art. 226, IV, 'a', do CP (estupro coletivo), ainda que não tenha praticado pessoalmente o ato sexual.", "C": "Tiago responde apenas pelo crime de constrangimento ilegal, em concurso material com o estupro praticado por Rodrigo.", "D": "A causa de aumento do estupro coletivo somente incide se todos os agentes envolvidos praticarem, cada um, o ato sexual contra a vítima."}, fb:{"A": "Incorreta. A coautoria no direito penal não exige que cada agente pratique pessoalmente todos os atos executórios do tipo — basta a contribuição relevante e o vínculo subjetivo com a conduta comum. Tiago contribuiu decisivamente, imobilizando a vítima.", "B": "Correta! Art. 226, IV, 'a', CP: a pena é aumentada de 1/3 a 2/3 se o estupro é cometido mediante concurso de 2 ou mais agentes (estupro coletivo). Não é necessário que todos os agentes pratiquem o ato sexual — basta que haja ciência, contribuição relevante e vínculo subjetivo entre os coautores. Tiago, ao imobilizar a vítima, contribuiu diretamente para a consumação do crime e responde como coautor, com a majorante.", "C": "Incorreta. Tiago não pratica um crime autônomo de constrangimento ilegal — sua contribuição integra o próprio crime de estupro, do qual é coautor.", "D": "Incorreta. Este é justamente o erro mais comum sobre o tema: a majorante do estupro coletivo não exige que todos os agentes pratiquem o ato sexual, apenas que atuem em concurso, contribuindo para o resultado."}, fund:"Art. 226, IV, 'a', CP (incluído pela Lei 13.718/2018): aumento de pena de 1/3 a 2/3 no caso de estupro coletivo, cometido mediante concurso de 2 ou mais agentes. A coautoria não exige a prática pessoal de todos os atos executórios — basta a contribuição relevante e o vínculo subjetivo (art. 29, CP).", caqui:"O erro mais cobrado sobre estupro coletivo é achar que 'coletivo' significa que todo mundo precisa ter praticado o ato sexual. Não é isso. É igual a um assalto em dupla: um aponta a arma e o outro pega a carteira — os dois são coautores do roubo, mesmo que só um tenha efetivamente subtraído o bem. Aqui, Tiago segurou a vítima — sem essa contribuição, talvez o crime nem se consumasse. Basta ciência do que está acontecendo + contribuição relevante para a execução."},
  {num:17, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Estupro Corretivo — Causa de Aumento do Art. 226, IV, 'b'", enunciado:"Um grupo de pessoas, movido pela intenção de 'corrigir' a orientação sexual de um jovem homossexual, pratica contra ele ato libidinoso mediante grave ameaça, com o objetivo declarado de alterar seu comportamento sexual.", comando:"Sobre a causa de aumento de pena aplicável ao caso, assinale a afirmativa correta.", gabarito:"D", alt:{"A": "Não há causa de aumento específica aplicável, devendo o caso ser tratado como estupro simples.", "B": "Aplica-se apenas a agravante genérica de motivo torpe (art. 61, II, 'a', CP), não havendo causa de aumento específica no Código Penal para esse contexto.", "C": "Aplica-se a causa de aumento do estupro coletivo (art. 226, IV, 'a', CP), por se tratar de conduta praticada por um grupo de pessoas.", "D": "Aplica-se a causa de aumento do art. 226, IV, 'b', CP, conhecida como 'estupro corretivo', que incide quando o crime é praticado para controlar o comportamento social ou sexual da vítima."}, fb:{"A": "Incorreta. Há causa de aumento específica prevista no Código Penal para exatamente essa hipótese.", "B": "Incorreta. Embora a agravante de motivo torpe também possa incidir, existe causa de aumento ESPECÍFICA do Código Penal para esse contexto, que deve ser aplicada com prioridade em razão da especialidade.", "C": "Incorreta. A alínea 'a' do inciso IV trata do estupro coletivo (concurso de 2 ou mais agentes). O caso descrito, embora também envolva um grupo, tem como elemento central a finalidade de controlar o comportamento da vítima — que se enquadra especificamente na alínea 'b'.", "D": "Correta! Art. 226, IV, 'b', CP (incluído pela Lei 13.718/2018): a pena é aumentada de 1/3 a 2/3 se o crime é praticado para controlar o comportamento social ou sexual da vítima — o chamado 'estupro corretivo'. É a hipótese frequentemente associada a crimes de ódio contra pessoas LGBTQIA+, praticados sob a falsa justificativa de 'corrigir' a orientação sexual ou identidade de gênero da vítima."}, fund:"Art. 226, IV, 'b', CP (incluído pela Lei 13.718/2018): aumento de pena de 1/3 a 2/3 quando o estupro é praticado para controlar o comportamento social ou sexual da vítima. É hipótese autônoma e distinta do estupro coletivo (alínea 'a'), embora as duas majorantes possam, em tese, coexistir no mesmo caso.", caqui:"O 'estupro corretivo' é um dos temas mais sensíveis e mais cobrados nas provas atuais — a lei deu nome próprio a uma prática de violência baseada em preconceito: usar o estupro como forma de 'punir' ou 'corrigir' a orientação sexual de alguém. É importante não confundir as duas alíneas do inciso IV: a) é sobre QUANTIDADE de agentes (coletivo); b) é sobre FINALIDADE da conduta (corretivo). As duas podem, inclusive, incidir juntas se o crime for praticado por um grupo E com essa finalidade."},
  {num:18, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Causas de Aumento do Art. 234-A — Gravidez, DST e Vítima Idosa", enunciado:"Em três casos distintos de estupro: em I, resulta gravidez da vítima; em II, o agente, sabendo ser portador de doença sexualmente transmissível, a transmite à vítima; em III, a vítima é pessoa idosa.", comando:"Considerando as causas de aumento previstas no art. 234-A do Código Penal, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "Em todos os três casos, a causa de aumento é a mesma: de 1/3 a 2/3.", "B": "No caso I, a pena é aumentada de metade a 2/3; nos casos II e III, a pena é aumentada de 1/3 a 2/3.", "C": "Apenas o caso I (gravidez) constitui causa de aumento prevista no art. 234-A; os casos II e III não têm previsão legal específica.", "D": "As causas de aumento do art. 234-A somente se aplicam aos crimes contra vulnerável, não ao estupro simples."}, fb:{"A": "Incorreta. As frações de aumento não são uniformes — a gravidez tem fração diferenciada e mais grave que a transmissão de doença e a vítima idosa ou com deficiência.", "B": "Correta! Art. 234-A, CP: a pena é aumentada de metade a 2/3 se do crime resulta gravidez; e de 1/3 a 2/3 se o agente transmite à vítima doença sexualmente transmissível de que sabe ou deveria saber ser portador, ou se a vítima é idosa ou pessoa com deficiência.", "C": "Incorreta. Todas as três hipóteses têm previsão expressa no art. 234-A do CP.", "D": "Incorreta. O art. 234-A se aplica aos crimes 'deste Título' — ou seja, a todos os crimes contra a dignidade sexual, inclusive o estupro simples (art. 213), não apenas aos crimes contra vulnerável."}, fund:"Art. 234-A, CP: causas de aumento comuns a todos os crimes contra a dignidade sexual. Aumento de metade a 2/3 se resulta gravidez; aumento de 1/3 a 2/3 se há transmissão de DST (com ciência ou dever de ciência do agente) ou se a vítima é idosa ou pessoa com deficiência.", caqui:"O art. 234-A é o 'artigo guarda-chuva' das causas de aumento — vale para qualquer crime do Título dos crimes contra a dignidade sexual, não só para o estupro de vulnerável. A fração de aumento não é igual para todas as hipóteses: gravidez tem o teto mais alto (metade a 2/3), porque gera uma consequência permanente e das mais graves. As outras duas hipóteses (DST e vítima idosa/deficiente) dividem a mesma fração (1/3 a 2/3). Memorize por associação: 'gravidez pesa mais' — metade a 2/3; o resto — 1/3 a 2/3."},
  {num:19, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Casa de Prostituição — Desnecessidade de Envolvimento de Vulnerável", enunciado:"Marta mantém, por conta própria, um estabelecimento no qual ocorre exploração sexual entre pessoas maiores e capazes, que ali comparecem voluntariamente. Marta não tem qualquer participação direta nos lucros obtidos pelas pessoas que se prostituem no local.", comando:"Considerando o Código Penal, assinale a afirmativa correta sobre a conduta de Marta.", gabarito:"A", alt:{"A": "Marta pratica o crime de casa de prostituição (art. 229, CP), sendo irrelevante para a tipicidade a ausência de intuito de lucro direto ou a maioridade e capacidade das pessoas envolvidas.", "B": "A conduta de Marta é atípica, pois todas as pessoas envolvidas são maiores, capazes e comparecem voluntariamente ao local.", "C": "Marta somente responderá pelo crime se ficar demonstrado que obteve lucro direto ou indireto com a exploração sexual ocorrida no estabelecimento.", "D": "A conduta de Marta configura o crime de rufianismo (art. 230, CP), e não o de casa de prostituição."}, fb:{"A": "Correta! Art. 229, CP: manter, por conta própria ou de terceiro, estabelecimento em que ocorra exploração sexual, havendo ou não intuito de lucro ou mediação direta do proprietário ou gerente. A lei é expressa: não importa se há lucro direto, e não importa que os envolvidos sejam maiores e capazes — o bem jurídico tutelado é a moralidade sexual pública, não apenas a proteção de vulneráveis.", "B": "Incorreta. Justamente por não exigir vulnerabilidade das pessoas envolvidas, a conduta de Marta é típica mesmo com participantes maiores, capazes e voluntários.", "C": "Incorreta. O próprio tipo penal afasta essa exigência: 'havendo ou não intuito de lucro'.", "D": "Incorreta. O rufianismo (art. 230) pune quem tira proveito da prostituição alheia, participando de seus lucros — é conduta distinta de manter o estabelecimento onde a exploração ocorre (art. 229)."}, fund:"Art. 229, CP: manter, por conta própria ou de terceiro, estabelecimento em que ocorra exploração sexual, havendo ou não intuito de lucro ou mediação direta do proprietário ou gerente. Pena: reclusão de 2 a 5 anos, e multa. Diferencia-se do rufianismo (art. 230), que exige participação nos lucros da prostituição alheia.", caqui:"Casa de prostituição (art. 229) é um crime que a doutrina chama de 'crime de perigo abstrato contra a moralidade pública' — não exige vítima vulnerável, não exige lucro, não exige coação. Basta manter o espaço onde a exploração sexual ocorre. Já o rufianismo (art. 230) é diferente: ali o agente precisa efetivamente viver às custas da prostituição de outra pessoa, tirando proveito dos seus lucros — é o clássico 'cafetão' que vive da renda alheia. Não confunda os dois: um pune o espaço, o outro pune quem vive do dinheiro."},
  {num:20, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Rufianismo — Distinção do Favorecimento da Prostituição", enunciado:"Cláudio vive às custas de sua companheira Renata, que exerce a prostituição por conta própria havendo mais de dois anos. Cláudio não a induz nem a atrai à prática, mas se sustenta integralmente com os valores que ela recebe de seus clientes, sem exercer qualquer atividade laboral própria.", comando:"Considerando o Código Penal, a conduta de Cláudio configura o crime de:", gabarito:"C", alt:{"A": "Favorecimento da prostituição ou outra forma de exploração sexual (art. 228, CP), pois Cláudio se beneficia da atividade de Renata.", "B": "Casa de prostituição (art. 229, CP), por manter relação de convivência com quem se prostitui.", "C": "Rufianismo (art. 230, CP), pois Cláudio tira proveito da prostituição de Renata, fazendo-se sustentar por ela.", "D": "A conduta é atípica, pois Renata exerce a prostituição por conta própria e de forma voluntária, sem qualquer indução por parte de Cláudio."}, fb:{"A": "Incorreta. O favorecimento da prostituição (art. 228) pune quem induz, atrai, facilita a prostituição ou impede/dificulta o abandono — Cláudio não pratica nenhuma dessas condutas; ele apenas vive às custas de Renata.", "B": "Incorreta. A casa de prostituição (art. 229) exige a manutenção de um estabelecimento onde ocorra exploração sexual — não é o caso descrito.", "C": "Correta! Art. 230, CP: tirar proveito da prostituição alheia, participando diretamente de seus lucros ou fazendo-se sustentar, no todo ou em parte, por quem a exerça. Cláudio se sustenta integralmente com os valores recebidos por Renata em sua atividade, o que configura exatamente o rufianismo.", "D": "Incorreta. A voluntariedade de Renata em se prostituir não afasta a tipicidade da conduta de Cláudio — o crime pune justamente quem vive às custas da prostituição alheia, independentemente de a pessoa exercer a atividade por livre e espontânea vontade."}, fund:"Art. 230, CP: tirar proveito da prostituição alheia, participando diretamente de seus lucros ou fazendo-se sustentar, no todo ou em parte, por quem a exerça. Pena: reclusão de 1 a 4 anos, e multa. Não se exige indução, atração ou facilitação da prostituição — apenas o proveito econômico dela.", caqui:"O rufianismo é o clássico crime do 'cafetão' ou 'agenciador': ele não precisa convencer ninguém a se prostituir, não precisa manter casa nenhuma — só precisa VIVER da renda da prostituição de outra pessoa. Repare que Renata já se prostituía por conta própria antes de conhecer Cláudio; ele simplesmente passou a se sustentar com esse dinheiro. É esse 'parasitismo econômico' que a lei pune. Se Cláudio tivesse convencido Renata a começar a se prostituir, aí sim entraria o art. 228."},
  {num:21, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Assédio Sexual — Causa de Aumento para Vítima Menor de 18 Anos", enunciado:"Fábio, gerente de uma loja, constrange Vitória, sua subordinada de 17 anos, com o intuito de obter favorecimento sexual, prevalecendo-se de sua condição de superior hierárquico.", comando:"Considerando o Código Penal, assinale a afirmativa correta.", gabarito:"D", alt:{"A": "Fábio pratica o crime de estupro de vulnerável, em razão da idade de Vitória.", "B": "Fábio pratica o crime de assédio sexual em sua forma simples, sendo irrelevante a idade de Vitória para fins de dosimetria da pena.", "C": "A conduta é atípica, pois o assédio sexual somente se configura entre pessoas maiores de idade.", "D": "Fábio pratica o crime de assédio sexual, com a pena aumentada em até um terço, em razão de Vitória ser menor de 18 anos."}, fb:{"A": "Incorreta. O estupro de vulnerável (art. 217-A) exige vítima menor de 14 anos, ou vulnerabilidade por enfermidade/deficiência mental. Vitória tem 17 anos, fora dessa faixa etária, e não há relato de conjunção carnal ou ato libidinoso mediante violência.", "B": "Incorreta. Existe causa de aumento específica em razão da idade da vítima, que não pode ser ignorada na dosimetria.", "C": "Incorreta. O assédio sexual não exige que a vítima seja maior de idade — pode ocorrer com vítima menor de 18 anos, inclusive com pena majorada nesse caso.", "D": "Correta! Art. 216-A, §2º, CP: a pena é aumentada em até um terço se a vítima é menor de 18 anos. O crime de assédio sexual (art. 216-A, caput) se configura com o constrangimento por superior hierárquico com intuito de obter vantagem sexual — e, sendo a vítima menor de 18 anos, incide essa majorante específica."}, fund:"Art. 216-A, caput, CP: assédio sexual — constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se de condição de superior hierárquico ou ascendência funcional. §2º (incluído pela Lei 12.015/2009): a pena é aumentada em até um terço se a vítima é menor de 18 anos.", caqui:"Atenção ao detalhe histórico dessa majorante: ela foi incluída pela Lei 12.015/2009 — a mesma lei que reformou todo o capítulo dos crimes sexuais — e não por leis mais recentes como a 13.718/2018 ou a 13.772/2018, que tratam de outros temas (importunação sexual e registro não autorizado, respectivamente). É comum confundir as leis quando o material de estudo lista várias reformas seguidas. O que importa para a prova: assédio sexual + vítima menor de 18 = pena pode subir até 1/3."},
  {num:22, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Divulgação de Cena de Sexo — Causa de Aumento por 'Pornografia de Vingança'", enunciado:"Após o término de um relacionamento amoroso de dois anos, Diego, com o objetivo de humilhar sua ex-companheira Sabrina, divulga em grupos de WhatsApp fotografias íntimas dela, tiradas durante o relacionamento com o consentimento de Sabrina apenas para uso privado do casal.", comando:"Considerando o Código Penal, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Diego pratica o crime de divulgação de cena de sexo, nudez ou pornografia (art. 218-C, CP), com a pena aumentada de 1/3 a 2/3, em razão da relação íntima de afeto mantida com a vítima e da finalidade de humilhação.", "B": "A conduta é atípica, pois Sabrina consentiu com a produção original das fotografias.", "C": "Diego pratica o crime na forma simples do art. 218-C, sem incidência de qualquer causa de aumento, pois a majorante exige que o relacionamento ainda esteja em curso no momento da divulgação.", "D": "Diego pratica o crime de registro não autorizado da intimidade sexual (art. 216-B, CP), e não o de divulgação de cena de sexo, nudez ou pornografia."}, fb:{"A": "Correta! Art. 218-C, caput, CP: divulgar, sem consentimento da vítima, cena de sexo, nudez ou pornografia. O consentimento de Sabrina se limitava à produção das imagens para uso privado do casal, não à divulgação. Além disso, o §1º do art. 218-C prevê aumento de pena de 1/3 a 2/3 quando o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima, ou com fim de vingança ou humilhação — a chamada 'pornografia de vingança', exatamente o caso de Diego.", "B": "Incorreta. O consentimento de Sabrina foi para a produção das imagens, não para sua divulgação a terceiros — são consentimentos distintos e autônomos.", "C": "Incorreta. A majorante do §1º expressamente abrange quem 'mantém OU TENHA MANTIDO' relação íntima de afeto com a vítima — não é necessário que o relacionamento ainda esteja em curso.", "D": "Incorreta. O art. 216-B pune a produção ou montagem da cena íntima sem autorização; aqui, as imagens foram produzidas com consentimento — o crime está na divulgação não autorizada, que é o núcleo do art. 218-C."}, fund:"Art. 218-C, caput, CP: divulgar, sem consentimento da vítima, cena de sexo, nudez ou pornografia. §1º: pena aumentada de 1/3 a 2/3 se o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima, ou com o fim de vingança ou humilhação. Pena-base elevada pela Lei 15.280/2025 para reclusão de 4 a 10 anos, e multa.", caqui:"A chamada 'pornografia de vingança' tem tratamento mais severo justamente porque envolve uma quebra de confiança dentro de uma relação íntima. Repare: o consentimento para PRODUZIR a imagem não vale como consentimento para DIVULGAR — são atos completamente diferentes, e é comum a prova tentar confundir isso. E o fato de o relacionamento já ter terminado não afasta a majorante — ao contrário, é justamente o cenário mais comum: quem diz 'ex' continua protegido pela causa de aumento se a divulgação for movida por vingança ou humilhação ligada àquele vínculo passado."},
  {num:23, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Descumprimento de Medidas Protetivas de Urgência — Novo Crime do Art. 338-A", enunciado:"Vítima de importunação sexual obteve, em juízo, medida protetiva de urgência determinando o afastamento do agressor de sua residência e local de trabalho, com base na Lei 15.280/2025. Dias depois, o agressor, ciente da decisão e regularmente intimado, comparece ao local de trabalho da vítima e se aproxima dela.", comando:"Considerando as inovações trazidas pela Lei 15.280/2025 ao Código Penal, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "O agressor não pratica crime autônomo, respondendo apenas por eventual desobediência genérica (art. 330, CP).", "B": "O agressor pratica o crime de descumprimento de medidas protetivas de urgência (art. 338-A, CP), com pena de reclusão de 2 a 5 anos, e multa, sendo irrelevante se a decisão foi proferida por juízo cível ou criminal.", "C": "O agressor somente pode ser responsabilizado criminalmente se a medida protetiva tiver sido concedida por juízo criminal, e não cível.", "D": "O descumprimento de medida protetiva de urgência, nos crimes contra a dignidade sexual, configura apenas falta grave administrativa, sem repercussão penal autônoma."}, fb:{"A": "Incorreta. A Lei 15.280/2025 criou tipo penal específico e autônomo para essa conduta (art. 338-A), afastando a aplicação do tipo genérico de desobediência.", "B": "Correta! Art. 338-A, CP (incluído pela Lei 15.280/2025): descumprir decisão judicial que defere medidas protetivas de urgência previstas para vítimas de crimes contra a dignidade sexual — pena de reclusão de 2 a 5 anos, e multa. A norma expressamente prevê que a configuração do crime independe da competência cível ou criminal do juízo que deferiu as medidas.", "C": "Incorreta. A própria lei afasta essa distinção — o crime se configura independentemente de a medida ter sido deferida por juízo cível ou criminal.", "D": "Incorreta. A Lei 15.280/2025 criou expressamente um crime, com pena de reclusão, para essa conduta, não se limitando a uma repercussão meramente administrativa."}, fund:"Art. 338-A, CP (incluído pela Lei 15.280/2025): descumprir decisão judicial que defere medidas protetivas de urgência — pena de reclusão de 2 a 5 anos, e multa. A configuração do crime independe da competência cível ou criminal do juiz que deferiu as medidas. A mesma lei criou, no CPP, medidas protetivas de urgência específicas para vítimas de crimes contra a dignidade sexual (arts. 350-A e 350-B), inspiradas no modelo da Lei Maria da Penha.", caqui:"Esse é um crime novinho — direto da Lei 15.280/2025 — e por isso merece atenção redobrada nas próximas provas. A lógica é a mesma da Lei Maria da Penha: não basta ter a medida protetiva no papel, é preciso que o descumprimento tenha consequência penal séria, senão a proteção vira letra morta. Um detalhe que a prova adora cobrar: não importa se foi um juiz cível ou criminal que concedeu a medida — o crime se configura do mesmo jeito. A lei foi expressa nesse ponto para evitar discussões de competência que esvaziassem a proteção da vítima."},
  {num:24, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Estupro Qualificado pela Idade — Distinção entre Vulnerabilidade Absoluta e Causa de Aumento", enunciado:"Em dois casos distintos: em I, o agente pratica conjunção carnal mediante grave ameaça contra vítima de 13 anos; em II, o agente pratica conjunção carnal mediante grave ameaça contra vítima de 16 anos.", comando:"Considerando o Código Penal, assinale a afirmativa correta.", gabarito:"C", alt:{"A": "Em ambos os casos, o crime é estupro de vulnerável (art. 217-A, CP), pois a vítima é menor de 18 anos.", "B": "Em ambos os casos, o crime é estupro simples (art. 213, CP), pois houve grave ameaça, o que afasta a aplicação do art. 217-A.", "C": "No caso I, o crime é estupro de vulnerável (art. 217-A, CP), pois a vítima é menor de 14 anos, sendo irrelevante a existência de grave ameaça. No caso II, o crime é estupro (art. 213, CP), com incidência da qualificadora do §1º, pois a vítima é maior de 14 e menor de 18 anos.", "D": "No caso II, a idade da vítima é penalmente irrelevante, já que ela é maior de 14 anos."}, fb:{"A": "Incorreta. O art. 217-A exige vítima MENOR de 14 anos. A vítima de 16 anos (caso II) está fora dessa faixa etária — o crime correto é o estupro do art. 213, com qualificadora específica.", "B": "Incorreta. No caso I, a vítima é menor de 14 anos, e a vulnerabilidade etária é absoluta — o crime é estupro de vulnerável independentemente de ter havido ou não grave ameaça, já que o próprio ato libidinoso com menor de 14 anos já caracteriza o tipo do art. 217-A.", "C": "Correta! Caso I: vítima menor de 14 anos = estupro de vulnerável (art. 217-A), por critério etário absoluto, independentemente do emprego de violência ou grave ameaça. Caso II: vítima maior de 14 e menor de 18 anos = estupro comum (art. 213), mas com incidência da qualificadora do §1º (reclusão de 8 a 12 anos), que abrange justamente essa faixa etária.", "D": "Incorreta. A idade da vítima entre 14 e 18 anos não é irrelevante — ela qualifica o crime de estupro, elevando a pena para 8 a 12 anos, nos termos do art. 213, §1º."}, fund:"Art. 217-A, CP: estupro de vulnerável — vítima menor de 14 anos, com vulnerabilidade etária absoluta. Art. 213, §1º, CP: qualifica o estupro comum quando a vítima é menor de 18 e maior de 14 anos (ou resulta lesão corporal grave) — pena de reclusão de 8 a 12 anos.", caqui:"O corte etário de 14 anos divide dois regimes jurídicos totalmente diferentes. Abaixo de 14 anos: vulnerabilidade absoluta — o próprio ato já é crime, não importa se houve violência, o tipo é o art. 217-A. Entre 14 e 18 anos: a vítima não é 'vulnerável' para fins do art. 217-A, mas se o agente usar violência ou grave ameaça, o crime é o estupro comum (art. 213) — só que QUALIFICADO pela idade, com pena maior (8 a 12 anos em vez de 6 a 10). É um erro clássico achar que 'menor de 18' sempre significa estupro de vulnerável — não é bem assim, o corte relevante para o art. 217-A é 14 anos, não 18."},
  {num:25, exame:"Questão Inédita — estilo FGV/OAB", titulo:"Ação Penal nos Crimes contra a Dignidade Sexual — Unificação pela Lei 13.718/2018", enunciado:"Em uma consulta jurídica, um cliente questiona se, para que o Ministério Público possa oferecer denúncia por crime de estupro contra sua filha, é necessário que a família formalize representação criminal junto à autoridade policial.", comando:"Como advogado(a), assinale a orientação juridicamente correta a ser dada ao cliente.", gabarito:"B", alt:{"A": "Sim, a representação da vítima ou de seu representante legal é imprescindível para a propositura da ação penal em crimes contra a dignidade sexual.", "B": "Não, pois desde a Lei 13.718/2018, todos os crimes contra a liberdade sexual e contra vulnerável (Capítulos I e II do Título VI do CP) são de ação penal pública incondicionada, dispensando representação da vítima.", "C": "A necessidade de representação depende da gravidade do crime: para o estupro simples, é dispensável; para o estupro de vulnerável, é obrigatória.", "D": "A representação é dispensável apenas se a vítima for menor de 14 anos; para vítimas entre 14 e 18 anos, permanece exigível."}, fb:{"A": "Incorreta. Desde 2018, nenhum crime contra a dignidade sexual dos Capítulos I e II do CP depende de representação da vítima.", "B": "Correta! Art. 225, CP (redação dada pela Lei 13.718/2018): nos crimes definidos nos Capítulos I e II deste Título, procede-se mediante ação penal pública incondicionada. Antes dessa lei, havia distinções (ação pública condicionada em certos casos); a partir de 2018, a regra foi unificada — todos passaram a ser de ação penal pública incondicionada, e o Ministério Público pode agir de ofício, sem necessidade de representação da vítima ou de seus representantes legais.", "C": "Incorreta. Não há essa distinção por gravidade — a unificação da Lei 13.718/2018 abrange igualmente o estupro simples e o estupro de vulnerável, ambos incondicionados.", "D": "Incorreta. Não há distinção por faixa etária da vítima — a incondicionalidade da ação penal vale para todos os crimes dos Capítulos I e II, independentemente da idade da vítima."}, fund:"Art. 225, CP (redação dada pela Lei 13.718/2018): nos crimes definidos nos Capítulos I (crimes contra a liberdade sexual) e II (crimes sexuais contra vulnerável) do Título VI, procede-se mediante ação penal pública incondicionada. Antes da lei, havia hipóteses de ação condicionada à representação; a reforma unificou o regime.", caqui:"Esse é um dos pontos mais cobrados em prova, porque muita gente ainda estuda pela regra antiga (pré-2018), que distinguia ação condicionada e incondicionada conforme a situação da vítima. Depois da Lei 13.718/2018, essa distinção acabou: TODOS os crimes de liberdade sexual e contra vulnerável são de ação penal pública incondicionada. Na prática, isso significa que a vítima (ou a família) não precisa 'autorizar' o Ministério Público a agir — ele pode e deve agir de ofício assim que toma conhecimento do fato, por qualquer meio (notícia de fato, boletim de ocorrência, denúncia anônima etc.)."},
];
let cur=0,N=QUESTOES.length;
const E=Array(N).fill(null);
function init(){
  const nw=document.getElementById('nw'),ct=document.getElementById('ct');
  QUESTOES.forEach((q,i)=>{
    const b=document.createElement('button');
    b.className='nb'+(i===0?' active':'');b.textContent=i+1;b.onclick=()=>go(i);b.id='n'+i;nw.appendChild(b);
    const d=document.createElement('div');d.className='qc'+(i===0?' vis':'');d.id='c'+i;d.innerHTML=bc(q,i);ct.appendChild(d);
  });upd();us();
}
function bc(q,i){
  const al=Object.entries(q.alt).map(([l,t])=>`<button class="ab" onclick="resp(${i},'${l}',this)" data-l="${l}"><span class="all">${l}</span><span class="alt">${t}</span></button>`).join('');
  return `<div class="qh"><span class="qn">Questão ${q.num}</span>${q.exame?`<span class="qe">${q.exame}</span>`:''}</div><h2 class="qt">${q.titulo}</h2><div class="en">${q.enunciado}</div><p class="co">${q.comando}</p><div class="al" id="a${i}">${al}</div><div class="fb" id="f${i}"></div><div class="fu" id="u${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div><div class="cx" id="x${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div><div class="ca"><div class="bg"><button class="btn vm" id="bu${i}" onclick="tF(${i})">Ver fundamento legal</button><button class="btn cq" id="bx${i}" onclick="tX(${i})">Explicação do Prof. Caqui</button><button class="btn" id="br${i}" onclick="rst(${i})">↺ Tentar novamente</button></div><span class="st" id="s${i}"></span></div>`;
}
function resp(i,l,btn){
  if(E[i]!==null)return;E[i]=l;const q=QUESTOES[i];
  document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=true;if(b.dataset.l===q.gabarito)b.classList.add('cor');if(b.dataset.l===l&&l!==q.gabarito)b.classList.add('err');});
  const ok=l===q.gabarito,f=document.getElementById('f'+i);
  f.className='fb sh '+(ok?'ac':'er');f.innerHTML=`<strong>${ok?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[l]}`;
  document.getElementById('s'+i).textContent=ok?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('br'+i).className='btn sh';document.getElementById('bu'+i).className='btn vm sh';document.getElementById('bx'+i).className='btn cq sh';
  const nb=document.getElementById('n'+i);nb.classList.remove('active');nb.classList.add(ok?'ok':'no');if(i===cur)nb.classList.add('active');us();
}
function tF(i){const b=document.getElementById('u'+i),t=document.getElementById('bu'+i),v=b.classList.contains('sh');b.className=v?'fu':'fu sh';t.textContent=v?'Ver fundamento legal':'Ocultar fundamento';}
function tX(i){const b=document.getElementById('x'+i),t=document.getElementById('bx'+i),v=b.classList.contains('sh');b.className=v?'cx':'cx sh';t.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';}
function rst(i){
  E[i]=null;document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=false;b.className='ab';});
  document.getElementById('f'+i).className='fb';document.getElementById('u'+i).className='fu';document.getElementById('bu'+i).className='btn vm';document.getElementById('bu'+i).textContent='Ver fundamento legal';
  document.getElementById('x'+i).className='cx';document.getElementById('bx'+i).className='btn cq';document.getElementById('bx'+i).textContent='Explicação do Prof. Caqui';
  document.getElementById('br'+i).className='btn';document.getElementById('s'+i).textContent='';
  document.getElementById('n'+i).className='nb'+(i===cur?' active':'');us();
}
function go(i){document.getElementById('c'+cur).classList.remove('vis');document.getElementById('n'+cur).classList.remove('active');cur=i;document.getElementById('c'+cur).classList.add('vis');document.getElementById('n'+cur).classList.add('active');upd();window.scrollTo({top:0,behavior:'smooth'});}
function nav(d){const n=cur+d;if(n>=0&&n<N)go(n);}
function upd(){document.getElementById('pi').textContent=(cur+1)+' de '+N;document.getElementById('bp').disabled=cur===0;document.getElementById('bn').disabled=cur===N-1;}
function us(){const r=E.filter(e=>e!==null).length,a=E.filter((e,i)=>e===QUESTOES[i].gabarito).length;document.getElementById('sc-t').textContent=r;document.getElementById('sc-a').textContent=a;document.getElementById('sc-e').textContent=r-a;const p=Math.round((r/N)*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pl').textContent=r+' de '+N+' respondidas';}
init();
</script>
